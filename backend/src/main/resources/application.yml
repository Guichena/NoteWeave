server:
  port: ${SERVER_PORT:8081}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} request_id=%X{request_id:-} correlation_id=%X{correlation_id:-} user_id=%X{user_id:-} workspace_id=%X{workspace_id:-} task_id=%X{task_id:-} source_id=%X{source_id:-} answer_run_id=%X{answer_run_id:-} event_id=%X{event_id:-} - %msg%n"

spring:
  application:
    name: noteweave-v2-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/noteweave?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:noteweave}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:4}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:noteweave-backend}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

noteweave:
  context:
    v2:
      shadow-enabled: ${NOTEWEAVE_CONTEXT_V2_SHADOW_ENABLED:false}
      active-enabled: ${NOTEWEAVE_CONTEXT_V2_ACTIVE_ENABLED:false}
      default-mode: ${NOTEWEAVE_CONTEXT_V2_DEFAULT_MODE:OFF}
      research-active-enabled: ${NOTEWEAVE_CONTEXT_V2_RESEARCH_ACTIVE_ENABLED:false}
      artifact-active-enabled: ${NOTEWEAVE_CONTEXT_V2_ARTIFACT_ACTIVE_ENABLED:false}
  research:
    strict-research-evidence-validation: ${NOTEWEAVE_RESEARCH_STRICT_EVIDENCE_VALIDATION:false}
    intent-matrix-v2: ${NOTEWEAVE_RESEARCH_INTENT_MATRIX_V2:false}
    runnable-work-v2: ${NOTEWEAVE_RESEARCH_RUNNABLE_WORK_V2:false}
    checkpoint-hydration-v2: ${NOTEWEAVE_RESEARCH_CHECKPOINT_HYDRATION_V2:false}
    evidence-audit-v1: ${NOTEWEAVE_RESEARCH_EVIDENCE_AUDIT_V1:false}
    worker-synthesis-v1: ${NOTEWEAVE_RESEARCH_WORKER_SYNTHESIS_V1:false}
    wide-discovery-v1: ${NOTEWEAVE_RESEARCH_WIDE_DISCOVERY_V1:false}
    wide-discovery-auto-accept: ${NOTEWEAVE_RESEARCH_WIDE_DISCOVERY_AUTO_ACCEPT:false}
    wide-discovery-accepted-precision: ${NOTEWEAVE_RESEARCH_WIDE_DISCOVERY_ACCEPTED_PRECISION:0.0}
    wide-discovery-precision-threshold: ${NOTEWEAVE_RESEARCH_WIDE_DISCOVERY_PRECISION_THRESHOLD:0.90}
    distributed-replay-observation: ${NOTEWEAVE_RESEARCH_DISTRIBUTED_REPLAY_OBSERVATION:false}
    agent:
      external-evidence-enabled: ${NOTEWEAVE_RESEARCH_AGENT_EXTERNAL_EVIDENCE_ENABLED:true}
      lifecycle-reaper-enabled: ${NOTEWEAVE_RESEARCH_AGENT_LIFECYCLE_REAPER_ENABLED:false}
      lifecycle-reaper-delay-ms: ${NOTEWEAVE_RESEARCH_AGENT_LIFECYCLE_REAPER_DELAY_MS:1000}
      command-dispatch-delay-ms: ${NOTEWEAVE_RESEARCH_AGENT_COMMAND_DISPATCH_DELAY_MS:1000}
      command-dispatch-batch-size: ${NOTEWEAVE_RESEARCH_AGENT_COMMAND_DISPATCH_BATCH_SIZE:25}
      rollout-guard-enabled: ${NOTEWEAVE_RESEARCH_AGENT_ROLLOUT_GUARD_ENABLED:true}
      rollout-window-minutes: ${NOTEWEAVE_RESEARCH_AGENT_ROLLOUT_WINDOW_MINUTES:15}
      rollout-minimum-task-sample: ${NOTEWEAVE_RESEARCH_AGENT_ROLLOUT_MINIMUM_TASK_SAMPLE:10}
      rollout-max-terminal-failure-rate: ${NOTEWEAVE_RESEARCH_AGENT_ROLLOUT_MAX_TERMINAL_FAILURE_RATE:0.20}
      rollout-max-delivery-failure-rate: ${NOTEWEAVE_RESEARCH_AGENT_ROLLOUT_MAX_DELIVERY_FAILURE_RATE:0.20}
      rollout-max-rejected-merge-rate: ${NOTEWEAVE_RESEARCH_AGENT_ROLLOUT_MAX_REJECTED_MERGE_RATE:0.30}
      rate-limit:
        enabled: ${NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_ENABLED:true}
        allow-local-fallback: ${NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_ALLOW_LOCAL_FALLBACK:false}
        capacity: ${NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_CAPACITY:24}
        refill-per-minute: ${NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_REFILL_PER_MINUTE:24}
  environment: ${NOTEWEAVE_ENVIRONMENT:local}
  video-learning:
    enabled: ${NOTEWEAVE_VIDEO_LEARNING_ENABLED:false}
    workspace-allowlist: ${NOTEWEAVE_VIDEO_LEARNING_WORKSPACE_ALLOWLIST:}
  retrieval:
    qa:
      mysql-fallback-enabled: ${NOTEWEAVE_QA_MYSQL_FALLBACK_ENABLED:false}
    note:
      local-metadata-fallback-enabled: ${NOTEWEAVE_NOTE_LOCAL_METADATA_FALLBACK_ENABLED:false}
  answer:
    events:
      channel-retention-seconds: ${NOTEWEAVE_ANSWER_EVENTS_CHANNEL_RETENTION_SECONDS:900}
      max-retained-channels: ${NOTEWEAVE_ANSWER_EVENTS_MAX_RETAINED_CHANNELS:10000}
  conversation:
    events:
      channel-retention-seconds: ${NOTEWEAVE_CONVERSATION_EVENTS_CHANNEL_RETENTION_SECONDS:900}
      max-retained-channels: ${NOTEWEAVE_CONVERSATION_EVENTS_MAX_RETAINED_CHANNELS:10000}
  upload:
    cleanup-delay-ms: ${NOTEWEAVE_UPLOAD_CLEANUP_DELAY_MS:60000}
    cleanup-stale-after-seconds: ${NOTEWEAVE_UPLOAD_CLEANUP_STALE_AFTER_SECONDS:86400}
  worker:
    artifact-callback-secret: ${NOTEWEAVE_ARTIFACT_CALLBACK_SECRET:}
    artifact-base-url: ${NOTEWEAVE_WORKER_ARTIFACT_BASE_URL:http://localhost:18092}
    connect-timeout-seconds: ${NOTEWEAVE_WORKER_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${NOTEWEAVE_WORKER_READ_TIMEOUT_SECONDS:30}
    artifact-input-unfenced-enabled: ${NOTEWEAVE_ARTIFACT_INPUT_UNFENCED_ENABLED:false}
  security:
    local-user-fallback: ${NOTEWEAVE_LOCAL_USER_FALLBACK:false}
    access-token-minutes: ${NOTEWEAVE_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${NOTEWEAVE_REFRESH_TOKEN_DAYS:30}
    registration-rate-limit:
      enabled: ${NOTEWEAVE_REGISTRATION_RATE_LIMIT_ENABLED:true}
      window-minutes: ${NOTEWEAVE_REGISTRATION_RATE_LIMIT_WINDOW_MINUTES:60}
      ip-max-attempts: ${NOTEWEAVE_REGISTRATION_RATE_LIMIT_IP_MAX_ATTEMPTS:20}
      account-max-attempts: ${NOTEWEAVE_REGISTRATION_RATE_LIMIT_ACCOUNT_MAX_ATTEMPTS:5}
    bootstrap:
      username: ${NOTEWEAVE_BOOTSTRAP_USERNAME:}
      email: ${NOTEWEAVE_BOOTSTRAP_EMAIL:}
      display-name: ${NOTEWEAVE_BOOTSTRAP_DISPLAY_NAME:NoteWeave Admin}
      password: ${NOTEWEAVE_BOOTSTRAP_PASSWORD:}
    acl-cache-enabled: ${NOTEWEAVE_ACL_CACHE_ENABLED:true}
    acl-cache-ttl-seconds: ${NOTEWEAVE_ACL_CACHE_TTL_SECONDS:300}
    acl-negative-cache-ttl-seconds: ${NOTEWEAVE_ACL_NEGATIVE_CACHE_TTL_SECONDS:30}
    acl-cache-jitter-seconds: ${NOTEWEAVE_ACL_CACHE_JITTER_SECONDS:60}
  cache:
    source-catalog:
      enabled: ${NOTEWEAVE_SOURCE_CATALOG_CACHE_ENABLED:true}
      ttl-seconds: ${NOTEWEAVE_SOURCE_CATALOG_CACHE_TTL_SECONDS:120}
      jitter-seconds: ${NOTEWEAVE_SOURCE_CATALOG_CACHE_JITTER_SECONDS:30}
    wiki-page-version:
      enabled: ${NOTEWEAVE_WIKI_PAGE_VERSION_CACHE_ENABLED:true}
      ttl-seconds: ${NOTEWEAVE_WIKI_PAGE_VERSION_CACHE_TTL_SECONDS:600}
      jitter-seconds: ${NOTEWEAVE_WIKI_PAGE_VERSION_CACHE_JITTER_SECONDS:120}
    memory-compiled-pack:
      enabled: ${NOTEWEAVE_MEMORY_COMPILED_PACK_CACHE_ENABLED:true}
      ttl-seconds: ${NOTEWEAVE_MEMORY_COMPILED_PACK_CACHE_TTL_SECONDS:180}
      jitter-seconds: ${NOTEWEAVE_MEMORY_COMPILED_PACK_CACHE_JITTER_SECONDS:30}
  quota:
    enabled: ${NOTEWEAVE_QUOTA_ENABLED:true}
    local-fallback-enabled: ${NOTEWEAVE_QUOTA_LOCAL_FALLBACK_ENABLED:false}
    rate:
      capacity: ${NOTEWEAVE_QUOTA_RATE_CAPACITY:20}
      refill-per-minute: ${NOTEWEAVE_QUOTA_RATE_REFILL_PER_MINUTE:20}
    concurrency:
      limit: ${NOTEWEAVE_QUOTA_CONCURRENCY_LIMIT:4}
      lease-seconds: ${NOTEWEAVE_QUOTA_LEASE_SECONDS:300}
    local:
      rate:
        capacity: ${NOTEWEAVE_QUOTA_LOCAL_RATE_CAPACITY:5}
        refill-per-minute: ${NOTEWEAVE_QUOTA_LOCAL_RATE_REFILL_PER_MINUTE:5}
      concurrency:
        limit: ${NOTEWEAVE_QUOTA_LOCAL_CONCURRENCY_LIMIT:1}
  redis:
    enabled: ${NOTEWEAVE_REDIS_ENABLED:true}
    connect-timeout-ms: ${NOTEWEAVE_REDIS_CONNECT_TIMEOUT_MS:500}
    command-timeout-ms: ${NOTEWEAVE_REDIS_COMMAND_TIMEOUT_MS:750}
  internal:
    auth-token: ${NOTEWEAVE_INTERNAL_AUTH_TOKEN:}
    research-auth-token: ${NOTEWEAVE_RESEARCH_INTERNAL_AUTH_TOKEN:}
    artifact-auth-token: ${NOTEWEAVE_ARTIFACT_INTERNAL_AUTH_TOKEN:}
  storage:
    backend: ${NOTEWEAVE_STORAGE_BACKEND:minio}
    local-root: ${NOTEWEAVE_STORAGE_LOCAL_ROOT:target/noteweave-storage}
    minio:
      endpoint: ${NOTEWEAVE_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${NOTEWEAVE_MINIO_ACCESS_KEY:}
      secret-key: ${NOTEWEAVE_MINIO_SECRET_KEY:}
      region: ${NOTEWEAVE_MINIO_REGION:us-east-1}
      bucket-source: ${NOTEWEAVE_MINIO_BUCKET_SOURCE:noteweave-source}
      bucket-derived: ${NOTEWEAVE_MINIO_BUCKET_DERIVED:noteweave-derived}
      bucket-export: ${NOTEWEAVE_MINIO_BUCKET_EXPORT:noteweave-export}
  document:
    chunk-max-tokens: ${NOTEWEAVE_DOCUMENT_CHUNK_MAX_TOKENS:600}
    chunk-overlap-tokens: ${NOTEWEAVE_DOCUMENT_CHUNK_OVERLAP_TOKENS:80}
  kafka:
    enabled: ${NOTEWEAVE_KAFKA_ENABLED:true}
    topics:
      source-parse: ${NOTEWEAVE_KAFKA_TOPIC_SOURCE_PARSE:noteweave.source.parse}
      source-chunk: ${NOTEWEAVE_KAFKA_TOPIC_SOURCE_CHUNK:noteweave.source.chunk}
      source-embed: ${NOTEWEAVE_KAFKA_TOPIC_SOURCE_EMBED:noteweave.source.embed}
      source-index: ${NOTEWEAVE_KAFKA_TOPIC_SOURCE_INDEX:noteweave.source.index}
      retrieval-projection: ${NOTEWEAVE_KAFKA_TOPIC_RETRIEVAL_PROJECTION:noteweave.retrieval.projection}
      wiki-ingest: ${NOTEWEAVE_KAFKA_TOPIC_WIKI_INGEST:noteweave.wiki.ingest}
      wiki-retract: ${NOTEWEAVE_KAFKA_TOPIC_WIKI_RETRACT:noteweave.wiki.retract}
      conversation-summary: ${NOTEWEAVE_KAFKA_TOPIC_CONVERSATION_SUMMARY:noteweave.conversation.summary}
      memory-extraction: ${NOTEWEAVE_KAFKA_TOPIC_MEMORY_EXTRACTION:noteweave.memory.extraction}
      research-agent-command: ${NOTEWEAVE_KAFKA_RESEARCH_AGENT_TOPIC:noteweave.research.agent.command}
    artifact-dlq-topic: ${NOTEWEAVE_KAFKA_ARTIFACT_DLQ_TOPIC:noteweave.artifact.job.dlq}
  elasticsearch:
    enabled: ${NOTEWEAVE_ES_ENABLED:true}
    host: ${NOTEWEAVE_ES_HOST:localhost}
    port: ${NOTEWEAVE_ES_PORT:9200}
    scheme: ${NOTEWEAVE_ES_SCHEME:http}
    index-prefix: ${NOTEWEAVE_ES_INDEX_PREFIX:noteweave_chunk}
    username: ${NOTEWEAVE_ES_USERNAME:}
    password: ${NOTEWEAVE_ES_PASSWORD:}
  embedding:
    enabled: ${NOTEWEAVE_EMBEDDING_ENABLED:true}
    endpoint: ${NOTEWEAVE_EMBEDDING_ENDPOINT:http://localhost:11434/v1/embeddings}
    model: ${NOTEWEAVE_EMBEDDING_MODEL:noteweave-embedding}
    api-key: ${NOTEWEAVE_EMBEDDING_API_KEY:}
    dimensions: ${NOTEWEAVE_EMBEDDING_DIMENSIONS:1024}
    document-batch-size: ${NOTEWEAVE_EMBEDDING_DOCUMENT_BATCH_SIZE:32}
    query-timeout-seconds: ${NOTEWEAVE_EMBEDDING_QUERY_TIMEOUT_SECONDS:10}
    batch-timeout-seconds: ${NOTEWEAVE_EMBEDDING_BATCH_TIMEOUT_SECONDS:60}
    max-input-characters: ${NOTEWEAVE_EMBEDDING_MAX_INPUT_CHARACTERS:12000}
    max-attempts: ${NOTEWEAVE_EMBEDDING_MAX_ATTEMPTS:3}
  rerank:
    enabled: ${NOTEWEAVE_RERANK_ENABLED:true}
    endpoint: ${NOTEWEAVE_RERANK_ENDPOINT:http://localhost:11434/v1/rerank}
    model: ${NOTEWEAVE_RERANK_MODEL:noteweave-rerank}
    api-key: ${NOTEWEAVE_RERANK_API_KEY:}
    batch-size: ${NOTEWEAVE_RERANK_BATCH_SIZE:80}
    max-document-characters: ${NOTEWEAVE_RERANK_MAX_DOCUMENT_CHARACTERS:1800}
    timeout-seconds: ${NOTEWEAVE_RERANK_TIMEOUT_SECONDS:20}
    max-attempts: ${NOTEWEAVE_RERANK_MAX_ATTEMPTS:3}
  llm:
    enabled: ${NOTEWEAVE_LLM_ENABLED:true}
    template-fallback-enabled: ${NOTEWEAVE_LLM_TEMPLATE_FALLBACK_ENABLED:false}
    endpoint: ${NOTEWEAVE_LLM_ENDPOINT:http://localhost:11434/v1/chat/completions}
    model: ${NOTEWEAVE_LLM_MODEL:noteweave-chat}
    api-key: ${NOTEWEAVE_LLM_API_KEY:}
    timeout-seconds: ${NOTEWEAVE_LLM_TIMEOUT_SECONDS:60}
  executors:
    scheduling:
      pool-size: ${NOTEWEAVE_SCHEDULING_POOL_SIZE:4}
    answer-io:
      core-size: ${NOTEWEAVE_ANSWER_IO_CORE_SIZE:4}
      max-size: ${NOTEWEAVE_ANSWER_IO_MAX_SIZE:16}
      queue-capacity: ${NOTEWEAVE_ANSWER_IO_QUEUE_CAPACITY:64}

management:
  health:
    elasticsearch:
      enabled: ${NOTEWEAVE_ES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
