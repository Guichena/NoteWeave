spring:
  datasource:
    url: jdbc:h2:mem:noteweave;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:19092
  data:
    redis:
      host: localhost
      port: 6379

noteweave:
  environment: test
  retrieval:
    qa:
      mysql-fallback-enabled: true
    note:
      local-metadata-fallback-enabled: true
  llm:
    enabled: false
    template-fallback-enabled: true
  embedding:
    enabled: false
  rerank:
    enabled: false
  quota:
    enabled: false
  security:
    local-user-fallback: true
    acl-cache-enabled: false
    registration-rate-limit:
      account-max-attempts: 3
      ip-max-attempts: 1000
  redis:
    enabled: false
  worker:
    artifact-auto-dispatch-enabled: false
    artifact-callback-secret: test-artifact-callback-secret
    artifact-input-unfenced-enabled: true
  video-learning:
    child-coordinator:
      enabled: false
  storage:
    backend: local
    local-root: target/test-noteweave-storage
  kafka:
    enabled: false
  research:
    agent:
      coordinator-enabled: false
      rollout-guard-enabled: false
  elasticsearch:
    enabled: false
