spring:
  datasource:
    url: jdbc:h2:mem:noteweave;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:19092
  data:
    redis:
      host: localhost
      port: 6379

noteweave:
  quota:
    enabled: false
  security:
    acl-cache-enabled: false
  redis:
    enabled: false
  worker:
    artifact-auto-dispatch-enabled: false
  storage:
    backend: local
    local-root: target/test-noteweave-storage
  kafka:
    enabled: false
  research:
    agent:
      coordinator-enabled: false
      rollout-guard-enabled: false
  elasticsearch:
    enabled: false
