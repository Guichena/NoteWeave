services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}
    container_name: noteweave-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-18082}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-noteweave}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-noteweave}
      DB_PASSWORD: ${MYSQL_PASSWORD:-noteweave}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-noteweave}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-noteweave-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-noteweave-dev}
      MINIO_TEST_BUCKET: ${MINIO_TEST_BUCKET:-noteweave-test}
      ES_URIS: http://elasticsearch:9200
      NOTEWEAVE_ES_INDEX_PREFIX: ${NOTEWEAVE_ES_INDEX_PREFIX:-noteweave-dev-}
      NOTEWEAVE_KAFKA_TOPIC_TASK: ${NOTEWEAVE_KAFKA_TOPIC_TASK:-noteweave.task}
      NOTEWEAVE_KAFKA_TOPIC_DOCUMENT: ${NOTEWEAVE_KAFKA_TOPIC_DOCUMENT:-noteweave.document}
      NOTEWEAVE_KAFKA_GROUP_TASK: ${NOTEWEAVE_KAFKA_GROUP_TASK:-noteweave-task-worker}
      NOTEWEAVE_KAFKA_GROUP_DOCUMENT: ${NOTEWEAVE_KAFKA_GROUP_DOCUMENT:-noteweave-document-process-worker}
      NOTEWEAVE_TASK_DISPATCHER_ENABLED: ${NOTEWEAVE_TASK_DISPATCHER_ENABLED:-true}
      NOTEWEAVE_TASK_DISPATCHER_FIXED_DELAY_MS: ${NOTEWEAVE_TASK_DISPATCHER_FIXED_DELAY_MS:-5000}
      NOTEWEAVE_UPLOAD_CLEANUP_ENABLED: ${NOTEWEAVE_UPLOAD_CLEANUP_ENABLED:-true}
      NOTEWEAVE_UPLOAD_CLEANUP_FIXED_DELAY_MS: ${NOTEWEAVE_UPLOAD_CLEANUP_FIXED_DELAY_MS:-600000}
      NOTEWEAVE_LLM_STUB_ENABLED: ${NOTEWEAVE_LLM_STUB_ENABLED:-true}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_MODEL: ${LLM_API_MODEL:-gemini-2.5-flash-lite}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      EMBEDDING_STUB_ENABLED: ${EMBEDDING_STUB_ENABLED:-true}
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_MODEL: ${EMBEDDING_API_MODEL:-jina-embeddings-v5-text-nano}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-HYBRID}
      RAG_BM25_WEIGHT: ${RAG_BM25_WEIGHT:-1.0}
      RAG_VECTOR_WEIGHT: ${RAG_VECTOR_WEIGHT:-1.0}
      RAG_WIKI_WEIGHT: ${RAG_WIKI_WEIGHT:-1.3}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.0}
    ports:
      - "${SERVER_PORT:-18082}:${SERVER_PORT:-18082}"

  mysql:
    image: mysql:8.4
    container_name: noteweave-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-noteweave}
      MYSQL_USER: ${MYSQL_USER:-noteweave}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-noteweave}
    ports:
      - "${MYSQL_PORT:-13307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - noteweave_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.2
    container_name: noteweave-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - noteweave_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: noteweave-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-noteweave}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-noteweave-minio-secret}
    ports:
      - "${MINIO_PORT:-19100}:9000"
      - "${MINIO_CONSOLE_PORT:-19101}:9001"
    volumes:
      - noteweave_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: noteweave-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-noteweave}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-noteweave-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-noteweave-dev}
      MINIO_TEST_BUCKET: ${MINIO_TEST_BUCKET:-noteweave-test}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set noteweave http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "noteweave/$$MINIO_BUCKET"
        mc mb --ignore-existing "noteweave/$$MINIO_TEST_BUCKET"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: noteweave-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${ES_PORT:-19200}:9200"
    volumes:
      - noteweave_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka:
    image: bitnamilegacy/kafka:latest
    container_name: noteweave-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${KAFKA_PORT:-19092}:9094"
    volumes:
      - noteweave_kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka-init:
    image: bitnamilegacy/kafka:latest
    container_name: noteweave-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic noteweave.task --partitions 3 --replication-factor 1
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic noteweave.document --partitions 3 --replication-factor 1
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic noteweave.index --partitions 3 --replication-factor 1

volumes:
  noteweave_mysql_data:
  noteweave_redis_data:
  noteweave_minio_data:
  noteweave_es_data:
  noteweave_kafka_data:
