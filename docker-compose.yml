services:
  mysql:
    image: mysql:8.4
    container_name: noteweave-v2-mysql
    restart: unless-stopped
    ports:
      - "${NOTEWEAVE_HOST_BIND_ADDRESS:-127.0.0.1}:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-noteweave}
      MYSQL_USER: ${MYSQL_USER:-noteweave}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - noteweave_v2_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2
    container_name: noteweave-v2-redis
    restart: unless-stopped
    ports:
      - "${NOTEWEAVE_HOST_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - noteweave_v2_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: bitnamilegacy/kafka@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107
    container_name: noteweave-v2-kafka
    restart: unless-stopped
    ports:
      - "${NOTEWEAVE_HOST_BIND_ADDRESS:-127.0.0.1}:9092:9094"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CLIENT_USERS: ${KAFKA_CLIENT_USERNAME:-noteweave}
      KAFKA_CLIENT_PASSWORDS: ${KAFKA_CLIENT_PASSWORD:?Set KAFKA_CLIENT_PASSWORD in .env}
      KAFKA_INTER_BROKER_USER: ${KAFKA_CLIENT_USERNAME:-noteweave}
      KAFKA_INTER_BROKER_PASSWORD: ${KAFKA_CLIENT_PASSWORD:?Set KAFKA_CLIENT_PASSWORD in .env}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms128m -Xmx256m}
    volumes:
      - noteweave_v2_kafka_wsl_clean2:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: noteweave-v2-minio
    restart: unless-stopped
    ports:
      - "${NOTEWEAVE_HOST_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${NOTEWEAVE_HOST_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - noteweave_v2_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: noteweave-v2-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set noteweave http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing noteweave/noteweave-source
        mc mb --ignore-existing noteweave/noteweave-derived
        mc mb --ignore-existing noteweave/noteweave-export

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: noteweave-v2-elasticsearch
    restart: unless-stopped
    ports:
      - "${NOTEWEAVE_HOST_BIND_ADDRESS:-127.0.0.1}:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms128m -Xmx128m}
    volumes:
      - noteweave_v2_es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:\"$${ELASTIC_PASSWORD}\" http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    container_name: noteweave-v2-backend
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8081
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/noteweave?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-noteweave}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-20}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-4}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:-30000}
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT_MS: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT_MS:-5000}
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME_MS: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME_MS:-1800000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${KAFKA_CLIENT_USERNAME:-noteweave}
      KAFKA_SASL_PASSWORD: ${KAFKA_CLIENT_PASSWORD:?Set KAFKA_CLIENT_PASSWORD in .env}
      NOTEWEAVE_KAFKA_RESEARCH_AGENT_TOPIC: ${NOTEWEAVE_KAFKA_RESEARCH_AGENT_TOPIC:-noteweave.research.agent.command}
      NOTEWEAVE_VIDEO_LEARNING_ENABLED: ${NOTEWEAVE_VIDEO_LEARNING_ENABLED:-false}
      NOTEWEAVE_VIDEO_LEARNING_WORKSPACE_ALLOWLIST: ${NOTEWEAVE_VIDEO_LEARNING_WORKSPACE_ALLOWLIST:-}
      NOTEWEAVE_KAFKA_TOPIC_RETRIEVAL_PROJECTION: ${NOTEWEAVE_KAFKA_TOPIC_RETRIEVAL_PROJECTION:-noteweave.retrieval.projection}
      NOTEWEAVE_STORAGE_BACKEND: minio
      NOTEWEAVE_MINIO_ENDPOINT: http://minio:9000
      NOTEWEAVE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      NOTEWEAVE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      NOTEWEAVE_ES_HOST: elasticsearch
      NOTEWEAVE_ES_PORT: 9200
      NOTEWEAVE_ES_SCHEME: http
      NOTEWEAVE_ES_USERNAME: elastic
      NOTEWEAVE_ES_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      NOTEWEAVE_ES_ENABLED: ${NOTEWEAVE_ES_ENABLED:-true}
      NOTEWEAVE_KAFKA_ARTIFACT_DLQ_TOPIC: ${NOTEWEAVE_KAFKA_ARTIFACT_DLQ_TOPIC:-noteweave.artifact.job.dlq}
      NOTEWEAVE_QA_MYSQL_FALLBACK_ENABLED: ${NOTEWEAVE_QA_MYSQL_FALLBACK_ENABLED:-true}
      NOTEWEAVE_NOTE_LOCAL_METADATA_FALLBACK_ENABLED: ${NOTEWEAVE_NOTE_LOCAL_METADATA_FALLBACK_ENABLED:-true}
      NOTEWEAVE_EMBEDDING_ENABLED: ${NOTEWEAVE_EMBEDDING_ENABLED:-true}
      NOTEWEAVE_EMBEDDING_ENDPOINT: ${NOTEWEAVE_EMBEDDING_ENDPOINT:-https://api.jina.ai/v1/embeddings}
      NOTEWEAVE_EMBEDDING_API_KEY: ${NOTEWEAVE_EMBEDDING_API_KEY:-}
      NOTEWEAVE_EMBEDDING_MODEL: ${NOTEWEAVE_EMBEDDING_MODEL:-jina-embeddings-v5-text-small}
      NOTEWEAVE_EMBEDDING_DIMENSIONS: ${NOTEWEAVE_EMBEDDING_DIMENSIONS:-1024}
      NOTEWEAVE_EMBEDDING_DOCUMENT_BATCH_SIZE: ${NOTEWEAVE_EMBEDDING_DOCUMENT_BATCH_SIZE:-32}
      NOTEWEAVE_EMBEDDING_QUERY_TIMEOUT_SECONDS: ${NOTEWEAVE_EMBEDDING_QUERY_TIMEOUT_SECONDS:-10}
      NOTEWEAVE_EMBEDDING_BATCH_TIMEOUT_SECONDS: ${NOTEWEAVE_EMBEDDING_BATCH_TIMEOUT_SECONDS:-60}
      NOTEWEAVE_EMBEDDING_MAX_INPUT_CHARACTERS: ${NOTEWEAVE_EMBEDDING_MAX_INPUT_CHARACTERS:-12000}
      NOTEWEAVE_EMBEDDING_MAX_ATTEMPTS: ${NOTEWEAVE_EMBEDDING_MAX_ATTEMPTS:-3}
      NOTEWEAVE_RERANK_ENABLED: ${NOTEWEAVE_RERANK_ENABLED:-true}
      NOTEWEAVE_RERANK_ENDPOINT: ${NOTEWEAVE_RERANK_ENDPOINT:-https://api.jina.ai/v1/rerank}
      NOTEWEAVE_RERANK_API_KEY: ${NOTEWEAVE_RERANK_API_KEY:-}
      NOTEWEAVE_RERANK_MODEL: ${NOTEWEAVE_RERANK_MODEL:-jina-reranker-v3.5}
      NOTEWEAVE_RERANK_BATCH_SIZE: ${NOTEWEAVE_RERANK_BATCH_SIZE:-80}
      NOTEWEAVE_RERANK_MAX_DOCUMENT_CHARACTERS: ${NOTEWEAVE_RERANK_MAX_DOCUMENT_CHARACTERS:-1800}
      NOTEWEAVE_RERANK_TIMEOUT_SECONDS: ${NOTEWEAVE_RERANK_TIMEOUT_SECONDS:-20}
      NOTEWEAVE_RERANK_MAX_ATTEMPTS: ${NOTEWEAVE_RERANK_MAX_ATTEMPTS:-3}
      NOTEWEAVE_STORAGE_LOCAL_ROOT: /app/storage
      NOTEWEAVE_WORKER_ARTIFACT_BASE_URL: http://artifact-worker-api:18092
      NOTEWEAVE_WORKER_CONNECT_TIMEOUT_SECONDS: ${NOTEWEAVE_WORKER_CONNECT_TIMEOUT_SECONDS:-3}
      NOTEWEAVE_WORKER_READ_TIMEOUT_SECONDS: ${NOTEWEAVE_WORKER_READ_TIMEOUT_SECONDS:-30}
      NOTEWEAVE_INTERNAL_AUTH_TOKEN: ${NOTEWEAVE_INTERNAL_AUTH_TOKEN:?Set NOTEWEAVE_INTERNAL_AUTH_TOKEN}
      NOTEWEAVE_RESEARCH_INTERNAL_AUTH_TOKEN: ${NOTEWEAVE_RESEARCH_INTERNAL_AUTH_TOKEN:?Set NOTEWEAVE_RESEARCH_INTERNAL_AUTH_TOKEN}
      NOTEWEAVE_ARTIFACT_INTERNAL_AUTH_TOKEN: ${NOTEWEAVE_ARTIFACT_INTERNAL_AUTH_TOKEN:?Set NOTEWEAVE_ARTIFACT_INTERNAL_AUTH_TOKEN}
      NOTEWEAVE_ARTIFACT_CALLBACK_SECRET: ${NOTEWEAVE_ARTIFACT_CALLBACK_SECRET:?Set NOTEWEAVE_ARTIFACT_CALLBACK_SECRET}
      NOTEWEAVE_LOCAL_USER_FALLBACK: ${NOTEWEAVE_LOCAL_USER_FALLBACK:-false}
      NOTEWEAVE_ENVIRONMENT: ${NOTEWEAVE_ENVIRONMENT:-development}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-development}
      NOTEWEAVE_BOOTSTRAP_USERNAME: ${NOTEWEAVE_BOOTSTRAP_USERNAME:-}
      NOTEWEAVE_BOOTSTRAP_EMAIL: ${NOTEWEAVE_BOOTSTRAP_EMAIL:-}
      NOTEWEAVE_BOOTSTRAP_DISPLAY_NAME: ${NOTEWEAVE_BOOTSTRAP_DISPLAY_NAME:-NoteWeave Admin}
      NOTEWEAVE_BOOTSTRAP_PASSWORD: ${NOTEWEAVE_BOOTSTRAP_PASSWORD:-}
      NOTEWEAVE_QUOTA_ENABLED: ${NOTEWEAVE_QUOTA_ENABLED:-true}
      NOTEWEAVE_QUOTA_RATE_CAPACITY: ${NOTEWEAVE_QUOTA_RATE_CAPACITY:-20}
      NOTEWEAVE_QUOTA_RATE_REFILL_PER_MINUTE: ${NOTEWEAVE_QUOTA_RATE_REFILL_PER_MINUTE:-20}
      NOTEWEAVE_QUOTA_CONCURRENCY_LIMIT: ${NOTEWEAVE_QUOTA_CONCURRENCY_LIMIT:-4}
      NOTEWEAVE_QUOTA_LEASE_SECONDS: ${NOTEWEAVE_QUOTA_LEASE_SECONDS:-300}
      NOTEWEAVE_QUOTA_LOCAL_RATE_CAPACITY: ${NOTEWEAVE_QUOTA_LOCAL_RATE_CAPACITY:-5}
      NOTEWEAVE_QUOTA_LOCAL_RATE_REFILL_PER_MINUTE: ${NOTEWEAVE_QUOTA_LOCAL_RATE_REFILL_PER_MINUTE:-5}
      NOTEWEAVE_QUOTA_LOCAL_CONCURRENCY_LIMIT: ${NOTEWEAVE_QUOTA_LOCAL_CONCURRENCY_LIMIT:-1}
      NOTEWEAVE_LLM_ENABLED: ${NOTEWEAVE_LLM_ENABLED:-true}
      NOTEWEAVE_LLM_TEMPLATE_FALLBACK_ENABLED: ${NOTEWEAVE_LLM_TEMPLATE_FALLBACK_ENABLED:-false}
      NOTEWEAVE_LLM_ENDPOINT: ${NOTEWEAVE_LLM_ENDPOINT:-https://api.siliconflow.cn/v1/chat/completions}
      NOTEWEAVE_LLM_API_KEY: ${NOTEWEAVE_LLM_API_KEY:-}
      NOTEWEAVE_LLM_MODEL: ${NOTEWEAVE_LLM_MODEL:-Pro/zai-org/GLM-5.2}
      NOTEWEAVE_LLM_TIMEOUT_SECONDS: ${NOTEWEAVE_LLM_TIMEOUT_SECONDS:-60}
      NOTEWEAVE_CONTEXT_V2_SHADOW_ENABLED: ${NOTEWEAVE_CONTEXT_V2_SHADOW_ENABLED:-true}
      NOTEWEAVE_CONTEXT_V2_ACTIVE_ENABLED: ${NOTEWEAVE_CONTEXT_V2_ACTIVE_ENABLED:-true}
      NOTEWEAVE_CONTEXT_V2_DEFAULT_MODE: ${NOTEWEAVE_CONTEXT_V2_DEFAULT_MODE:-ACTIVE}
      NOTEWEAVE_RESEARCH_AGENT_COMMAND_DISPATCH_DELAY_MS: ${NOTEWEAVE_RESEARCH_AGENT_COMMAND_DISPATCH_DELAY_MS:-1000}
      NOTEWEAVE_RESEARCH_AGENT_COMMAND_DISPATCH_BATCH_SIZE: ${NOTEWEAVE_RESEARCH_AGENT_COMMAND_DISPATCH_BATCH_SIZE:-25}
      NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_CAPACITY: ${NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_CAPACITY:-24}
      NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_REFILL_PER_MINUTE: ${NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_REFILL_PER_MINUTE:-24}
      NOTEWEAVE_RESEARCH_AGENT_ROLLOUT_GUARD_ENABLED: ${NOTEWEAVE_RESEARCH_AGENT_ROLLOUT_GUARD_ENABLED:-false}
      NOTEWEAVE_RESEARCH_STRICT_EVIDENCE_VALIDATION: ${NOTEWEAVE_RESEARCH_STRICT_EVIDENCE_VALIDATION:-false}
      NOTEWEAVE_RESEARCH_INTENT_MATRIX_V2: ${NOTEWEAVE_RESEARCH_INTENT_MATRIX_V2:-false}
      NOTEWEAVE_RESEARCH_RUNNABLE_WORK_V2: ${NOTEWEAVE_RESEARCH_RUNNABLE_WORK_V2:-false}
      NOTEWEAVE_RESEARCH_CHECKPOINT_HYDRATION_V2: ${NOTEWEAVE_RESEARCH_CHECKPOINT_HYDRATION_V2:-false}
      NOTEWEAVE_RESEARCH_EVIDENCE_AUDIT_V1: ${NOTEWEAVE_RESEARCH_EVIDENCE_AUDIT_V1:-false}
      NOTEWEAVE_RESEARCH_WORKER_SYNTHESIS_V1: ${NOTEWEAVE_RESEARCH_WORKER_SYNTHESIS_V1:-false}
      NOTEWEAVE_RESEARCH_WIDE_DISCOVERY_V1: ${NOTEWEAVE_RESEARCH_WIDE_DISCOVERY_V1:-false}
      NOTEWEAVE_RESEARCH_WIDE_DISCOVERY_AUTO_ACCEPT: ${NOTEWEAVE_RESEARCH_WIDE_DISCOVERY_AUTO_ACCEPT:-false}
      NOTEWEAVE_RESEARCH_DISTRIBUTED_REPLAY_OBSERVATION: ${NOTEWEAVE_RESEARCH_DISTRIBUTED_REPLAY_OBSERVATION:-false}
    volumes:
      - noteweave_v2_backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: noteweave-v2-frontend
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NOTEWEAVE_HOST_BIND_ADDRESS:-127.0.0.1}:3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  research-worker-consumer:
    build:
      context: ./workers/research-worker
    container_name: noteweave-v2-research-worker-consumer
    restart: on-failure:5
    profiles: ["app"]
    command: ["python", "-m", "app.agent_kafka_consumer"]
    depends_on:
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NOTEWEAVE_JAVA_BASE_URL: ${NOTEWEAVE_JAVA_BASE_URL:-http://backend:8081}
      NOTEWEAVE_ENVIRONMENT: ${NOTEWEAVE_ENVIRONMENT:-development}
      NOTEWEAVE_RESEARCH_INTERNAL_AUTH_TOKEN: ${NOTEWEAVE_RESEARCH_INTERNAL_AUTH_TOKEN:?Set NOTEWEAVE_RESEARCH_INTERNAL_AUTH_TOKEN}
      NOTEWEAVE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTEWEAVE_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      NOTEWEAVE_KAFKA_SASL_MECHANISM: PLAIN
      NOTEWEAVE_KAFKA_SASL_USERNAME: ${KAFKA_CLIENT_USERNAME:-noteweave}
      NOTEWEAVE_KAFKA_SASL_PASSWORD: ${KAFKA_CLIENT_PASSWORD:?Set KAFKA_CLIENT_PASSWORD in .env}
      NOTEWEAVE_KAFKA_RESEARCH_AGENT_TOPIC: ${NOTEWEAVE_KAFKA_RESEARCH_AGENT_TOPIC:-noteweave.research.agent.command}
      NOTEWEAVE_KAFKA_RESEARCH_AGENT_DLQ_TOPIC: ${NOTEWEAVE_KAFKA_RESEARCH_AGENT_DLQ_TOPIC:-noteweave.research.agent.command.dlq}
      NOTEWEAVE_KAFKA_RESEARCH_AGENT_GROUP_ID: ${NOTEWEAVE_KAFKA_RESEARCH_AGENT_GROUP_ID:-noteweave-research-agent-worker}
      NOTEWEAVE_RESEARCH_AGENT_CONSUMER_ENABLED: ${NOTEWEAVE_RESEARCH_AGENT_CONSUMER_ENABLED:-true}
      NOTEWEAVE_RESEARCH_AGENT_DEEP_CELL_EXECUTOR_ENABLED: ${NOTEWEAVE_RESEARCH_AGENT_DEEP_CELL_EXECUTOR_ENABLED:-true}
      NOTEWEAVE_RESEARCH_AGENT_FAKE_PROVIDER_ENABLED: ${NOTEWEAVE_RESEARCH_AGENT_FAKE_PROVIDER_ENABLED:-false}
      NOTEWEAVE_RESEARCH_AGENT_EVIDENCE_AUDIT_ENABLED: ${NOTEWEAVE_RESEARCH_AGENT_EVIDENCE_AUDIT_ENABLED:-false}
      NOTEWEAVE_RESEARCH_AGENT_SYNTHESIS_ENABLED: ${NOTEWEAVE_RESEARCH_AGENT_SYNTHESIS_ENABLED:-false}
      NOTEWEAVE_RESEARCH_AGENT_WIDE_DISCOVERY_ENABLED: ${NOTEWEAVE_RESEARCH_AGENT_WIDE_DISCOVERY_ENABLED:-false}
      # A single stable identity keeps the default demo worker claimable after
      # restarts. Override this with a unique value for each worker replica.
      NOTEWEAVE_RESEARCH_AGENT_WORKER_INSTANCE_ID: ${NOTEWEAVE_RESEARCH_AGENT_WORKER_INSTANCE_ID:-research-agent-worker-1}
      NOTEWEAVE_RESEARCH_AGENT_LEASE_SECONDS: ${NOTEWEAVE_RESEARCH_AGENT_LEASE_SECONDS:-60}
      NOTEWEAVE_RESEARCH_AGENT_HEARTBEAT_INTERVAL_SECONDS: ${NOTEWEAVE_RESEARCH_AGENT_HEARTBEAT_INTERVAL_SECONDS:-15}
      NOTEWEAVE_RESEARCH_AGENT_HEARTBEAT_FAILURE_BUDGET_SECONDS: ${NOTEWEAVE_RESEARCH_AGENT_HEARTBEAT_FAILURE_BUDGET_SECONDS:-30}
      NOTEWEAVE_RESEARCH_AGENT_HEARTBEAT_REQUEST_TIMEOUT_SECONDS: ${NOTEWEAVE_RESEARCH_AGENT_HEARTBEAT_REQUEST_TIMEOUT_SECONDS:-5}
      NOTEWEAVE_RESEARCH_AGENT_COMPLETION_MAX_ATTEMPTS: ${NOTEWEAVE_RESEARCH_AGENT_COMPLETION_MAX_ATTEMPTS:-3}
      NOTEWEAVE_RESEARCH_AGENT_DRAIN_GRACE_SECONDS: ${NOTEWEAVE_RESEARCH_AGENT_DRAIN_GRACE_SECONDS:-30}
      NOTEWEAVE_RESEARCH_AGENT_DRAIN_POLL_TIMEOUT_MS: ${NOTEWEAVE_RESEARCH_AGENT_DRAIN_POLL_TIMEOUT_MS:-500}
      NOTEWEAVE_KAFKA_CONSUME_MAX_ATTEMPTS: ${NOTEWEAVE_KAFKA_CONSUME_MAX_ATTEMPTS:-3}
      NOTEWEAVE_RESEARCH_LLM_API_KEY: ${NOTEWEAVE_RESEARCH_LLM_API_KEY:-}
      NOTEWEAVE_RESEARCH_LLM_BASE_URL: ${NOTEWEAVE_RESEARCH_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      NOTEWEAVE_RESEARCH_LLM_MODEL: ${NOTEWEAVE_RESEARCH_LLM_MODEL:-Pro/zai-org/GLM-5.2}
      NOTEWEAVE_RESEARCH_LLM_TIMEOUT_SECONDS: ${NOTEWEAVE_RESEARCH_LLM_TIMEOUT_SECONDS:-60}
      NOTEWEAVE_RESEARCH_LLM_MAX_ATTEMPTS: ${NOTEWEAVE_RESEARCH_LLM_MAX_ATTEMPTS:-3}
      NOTEWEAVE_RESEARCH_LLM_MAX_TOTAL_CALLS: ${NOTEWEAVE_RESEARCH_LLM_MAX_TOTAL_CALLS:-64}
      NOTEWEAVE_RESEARCH_LLM_MAX_INPUT_CHARS: ${NOTEWEAVE_RESEARCH_LLM_MAX_INPUT_CHARS:-120000}
      NOTEWEAVE_RESEARCH_LLM_CONTEXT_SAFETY_BUFFER_CHARS: ${NOTEWEAVE_RESEARCH_LLM_CONTEXT_SAFETY_BUFFER_CHARS:-8000}
      NOTEWEAVE_RESEARCH_LLM_INPUT_COST_PER_MILLION: ${NOTEWEAVE_RESEARCH_LLM_INPUT_COST_PER_MILLION:-0}
      NOTEWEAVE_RESEARCH_LLM_OUTPUT_COST_PER_MILLION: ${NOTEWEAVE_RESEARCH_LLM_OUTPUT_COST_PER_MILLION:-0}
      NOTEWEAVE_RESEARCH_LLM_PURPOSE_OPTIONS: '${NOTEWEAVE_RESEARCH_LLM_PURPOSE_OPTIONS:-{}}'
      NOTEWEAVE_RESEARCH_PUBLIC_SEARCH_ENABLED: ${NOTEWEAVE_RESEARCH_PUBLIC_SEARCH_ENABLED:-true}
      NOTEWEAVE_RESEARCH_SEARCH_PROVIDER_CHAIN: ${NOTEWEAVE_RESEARCH_SEARCH_PROVIDER_CHAIN:-serper,wikipedia}
      NOTEWEAVE_RESEARCH_SEARCH_API_KEY: ${NOTEWEAVE_RESEARCH_SEARCH_API_KEY:-}
      NOTEWEAVE_RESEARCH_SEARCH_BASE_URL: ${NOTEWEAVE_RESEARCH_SEARCH_BASE_URL:-}
      NOTEWEAVE_RESEARCH_SEARCH_MAX_PAGES: ${NOTEWEAVE_RESEARCH_SEARCH_MAX_PAGES:-2}
      NOTEWEAVE_RESEARCH_SERPER_API_KEY: ${NOTEWEAVE_RESEARCH_SERPER_API_KEY:-}
      NOTEWEAVE_RESEARCH_SERPER_BASE_URL: ${NOTEWEAVE_RESEARCH_SERPER_BASE_URL:-https://google.serper.dev/search}
      NOTEWEAVE_RESEARCH_ENABLE_URL_READER: ${NOTEWEAVE_RESEARCH_ENABLE_URL_READER:-false}
      NOTEWEAVE_RESEARCH_JINA_API_KEY: ${NOTEWEAVE_RESEARCH_JINA_API_KEY:-}
      NOTEWEAVE_RESEARCH_JINA_BASE_URL: ${NOTEWEAVE_RESEARCH_JINA_BASE_URL:-https://r.jina.ai/}
      # Docker Desktop may expose public DNS through its RFC 2544 synthetic
      # address pool. The worker still rejects literal/private targets.
      NOTEWEAVE_ALLOW_DOCKER_SYNTHETIC_DNS: ${NOTEWEAVE_ALLOW_DOCKER_SYNTHETIC_DNS:-true}
      NOTEWEAVE_RESEARCH_AGENT_EXECUTION_MODE: ${NOTEWEAVE_RESEARCH_AGENT_EXECUTION_MODE:-INCREMENTAL_V1}
      NOTEWEAVE_RESEARCH_AGENT_MAX_CONCURRENCY: ${NOTEWEAVE_RESEARCH_AGENT_MAX_CONCURRENCY:-1}
      NOTEWEAVE_RESEARCH_AGENT_BUNDLE_MAX_CELLS: ${NOTEWEAVE_RESEARCH_AGENT_BUNDLE_MAX_CELLS:-3}
    healthcheck:
      test: ["CMD", "python", "-m", "app.agent_kafka_consumer", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  artifact-worker-api:
    build:
      context: ./workers/artifact-worker
    container_name: noteweave-v2-artifact-worker-api
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NOTEWEAVE_JAVA_BASE_URL: http://backend:8081
      NOTEWEAVE_ENVIRONMENT: ${NOTEWEAVE_ENVIRONMENT:-development}
      NOTEWEAVE_ARTIFACT_INTERNAL_AUTH_TOKEN: ${NOTEWEAVE_ARTIFACT_INTERNAL_AUTH_TOKEN:?Set NOTEWEAVE_ARTIFACT_INTERNAL_AUTH_TOKEN}
      NOTEWEAVE_ARTIFACT_CALLBACK_SECRET: ${NOTEWEAVE_ARTIFACT_CALLBACK_SECRET:?Set NOTEWEAVE_ARTIFACT_CALLBACK_SECRET}
      NOTEWEAVE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTEWEAVE_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      NOTEWEAVE_KAFKA_SASL_MECHANISM: PLAIN
      NOTEWEAVE_KAFKA_SASL_USERNAME: ${KAFKA_CLIENT_USERNAME:-noteweave}
      NOTEWEAVE_KAFKA_SASL_PASSWORD: ${KAFKA_CLIENT_PASSWORD:?Set KAFKA_CLIENT_PASSWORD in .env}
      NOTEWEAVE_KAFKA_ARTIFACT_TOPIC: noteweave.artifact.job
      NOTEWEAVE_KAFKA_ARTIFACT_DLQ_TOPIC: ${NOTEWEAVE_KAFKA_ARTIFACT_DLQ_TOPIC:-noteweave.artifact.job.dlq}
      NOTEWEAVE_KAFKA_ARTIFACT_GROUP_ID: ${NOTEWEAVE_KAFKA_ARTIFACT_GROUP_ID:-noteweave-artifact-worker}
      NOTEWEAVE_ARTIFACT_CONSUMER_ENABLED: ${NOTEWEAVE_ARTIFACT_CONSUMER_ENABLED:-true}
      NOTEWEAVE_KAFKA_ARTIFACT_MAX_POLL_INTERVAL_SECONDS: ${NOTEWEAVE_KAFKA_ARTIFACT_MAX_POLL_INTERVAL_SECONDS:-4200}
      NOTEWEAVE_KAFKA_CONSUME_MAX_ATTEMPTS: ${NOTEWEAVE_KAFKA_CONSUME_MAX_ATTEMPTS:-3}
      NOTEWEAVE_ARTIFACT_REPOSITORY_BACKEND: file
      NOTEWEAVE_ARTIFACT_REPOSITORY_FILE_PATH: /app/runtime/artifact-repository.json
      NOTEWEAVE_ARTIFACT_CUSTOMIZATION_FILE_PATH: /app/runtime/artifact-customizations.json
      NOTEWEAVE_ARTIFACT_RUNTIME_STATE_FILE_PATH: /app/runtime/artifact-runtime-state.json
      NOTEWEAVE_ARTIFACT_WAIT_QUEUE_FILE_PATH: /app/runtime/artifact-wait-queue.json
      NOTEWEAVE_MCP_SANDBOX_ROOT: /app/runtime
      NOTEWEAVE_DEBUG_ROUTES_ENABLED: ${NOTEWEAVE_ARTIFACT_DEBUG_ROUTES_ENABLED:-false}
      NOTEWEAVE_ARTIFACT_LLM_API_KEY: ${NOTEWEAVE_ARTIFACT_LLM_API_KEY:-}
      NOTEWEAVE_ARTIFACT_LLM_BASE_URL: ${NOTEWEAVE_ARTIFACT_LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      NOTEWEAVE_ARTIFACT_LLM_MODEL: ${NOTEWEAVE_ARTIFACT_LLM_MODEL:-Pro/zai-org/GLM-5.2}
      NOTEWEAVE_ARTIFACT_LLM_TIMEOUT_SECONDS: ${NOTEWEAVE_ARTIFACT_LLM_TIMEOUT_SECONDS:-60}
      NOTEWEAVE_MCP_PROCESS_TIMEOUT_SECONDS: ${NOTEWEAVE_MCP_PROCESS_TIMEOUT_SECONDS:-3600}
      # 资料库音视频转写：MCP 转写工具使用的 faster-whisper 模型、语言提示和设备
      NOTEWEAVE_TRANSCRIPTION_MODEL: ${NOTEWEAVE_TRANSCRIPTION_MODEL:-small}
      NOTEWEAVE_TRANSCRIPTION_LANGUAGE: ${NOTEWEAVE_TRANSCRIPTION_LANGUAGE:-zh}
      NOTEWEAVE_TRANSCRIPTION_DEVICE: ${NOTEWEAVE_TRANSCRIPTION_DEVICE:-cpu}
      # 模型文件走普通 HTTP 下载；Xet 传输协议在部分网络环境下会卡住
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      NOTEWEAVE_ALLOW_PORTABLE_PDF_FALLBACK: ${NOTEWEAVE_ALLOW_PORTABLE_PDF_FALLBACK:-false}
    volumes:
      - noteweave_v2_artifact_worker_runtime:/app/runtime
      # faster-whisper 模型缓存（系统 MCP 的 download_root），避免容器重建后重新下载
      - noteweave_v2_whisper_models:/root/.codex/skills/bilibili-render-pdf/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18092/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  noteweave_v2_mysql:
  noteweave_v2_redis:
  noteweave_v2_kafka:
  noteweave_v2_kafka_wsl:
  noteweave_v2_kafka_wsl_clean2:
  noteweave_v2_minio:
  noteweave_v2_es:
  noteweave_v2_backend_storage:
  noteweave_v2_artifact_worker_runtime:
  noteweave_v2_whisper_models:
