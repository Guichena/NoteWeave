<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, Helvetica, Arial, sans-serif">
  <defs><marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="700.0" y="44.0" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">流式回答：Redis Stream 跨实例中转 SSE，按序号断线续读</text>
  <text x="700.0" y="72.0" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">MySQL 保存最终快照；Redis 只负责实时传输，按条数裁剪控制内存，游标过期时从快照恢复</text>
  <rect x="40.0" y="104.0" width="220.0" height="64.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="54.0" y="128.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">浏览器</text>
  <text x="54.0" y="152.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">POST 发送消息</text>
  <rect x="286.0" y="104.0" width="300.0" height="100.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="300.0" y="128.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">提交回合</text>
  <text x="300.0" y="152.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">写入用户消息与回答占位</text>
  <text x="300.0" y="171.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">立即返回回合回执</text>
  <text x="300.0" y="190.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">按提交 ID 幂等，可恢复</text>
  <rect x="612.0" y="104.0" width="330.0" height="100.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="626.0" y="128.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">后台准备与生成</text>
  <text x="626.0" y="152.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">冻结、改写、检索、记忆编译</text>
  <text x="626.0" y="171.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">每个阶段发布进度事件</text>
  <text x="626.0" y="190.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">模型 token 逐段发布</text>
  <rect x="968.0" y="96.0" width="392.0" height="120.0" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="982.0" y="120.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">Redis Stream（每个回答一条）</text>
  <rect x="1318.9" y="105.0" width="33.1" height="20.0" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="1335.4" y="119.0" font-size="11" font-weight="400" fill="#0c4a6e" text-anchor="middle">Lua</text>
  <text x="982.0" y="144.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">Lua 脚本：INCR 分配单调序号，XADD 写入</text>
  <text x="982.0" y="163.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">超过 512 条时 XDEL 删除最旧的事件</text>
  <text x="982.0" y="182.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">记录已裁剪到的位置，TTL 600 秒</text>
  <text x="982.0" y="203.0" font-size="11" font-weight="400" fill="#0284c7" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">RedisAnswerRealtimeBridge</text>
  <path d="M260.0,136.0 L286.0,136.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M586.0,154.0 L612.0,154.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M942.0,154.0 L968.0,154.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="968.0" y="300.0" width="392.0" height="120.0" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="982.0" y="324.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">多实例转发</text>
  <text x="982.0" y="348.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">处理连接的实例按序号从 Stream 读取</text>
  <text x="982.0" y="367.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">本地有界回放缓存兜底</text>
  <text x="982.0" y="386.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">每个订阅者一条串行队列，慢消费者不拖累其他人</text>
  <text x="982.0" y="407.0" font-size="11" font-weight="400" fill="#0284c7" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">SessionEventMux</text>
  <rect x="500.0" y="308.0" width="420.0" height="100.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="514.0" y="332.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">SSE 推送</text>
  <text x="514.0" y="356.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">事件 id 就是序号</text>
  <text x="514.0" y="375.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">完成、失败、取消为终止事件</text>
  <text x="514.0" y="394.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">终止后关闭连接</text>
  <rect x="40.0" y="308.0" width="420.0" height="82.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="54.0" y="332.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">浏览器渲染</text>
  <text x="54.0" y="356.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">按序号渲染，重复序号直接丢弃</text>
  <text x="54.0" y="375.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">阶段事件显示准备进度</text>
  <path d="M1164.0,216.0 L1164.0,300.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M968.0,360.0 L920.0,360.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M500.0,358.0 L460.0,358.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="40.0" y="500.0" width="420.0" height="82.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="54.0" y="524.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">断线重连</text>
  <text x="54.0" y="548.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">请求头带 Last-Event-ID</text>
  <text x="54.0" y="567.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">取它与 after 参数中较大的一个作游标</text>
  <rect x="500.0" y="500.0" width="420.0" height="100.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="514.0" y="524.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">续读</text>
  <text x="514.0" y="548.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">读取 Stream 中序号之后的事件</text>
  <text x="514.0" y="567.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">与本地回放合并去重后补发</text>
  <text x="514.0" y="586.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">续上之后继续接收实时事件</text>
  <rect x="960.0" y="500.0" width="400.0" height="82.0" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="974.0" y="524.0" font-size="14.5" font-weight="700" fill="#881337" text-anchor="start">游标早于已裁剪位置</text>
  <text x="974.0" y="548.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">返回 409 ANSWER_EVENT_CURSOR_EXPIRED</text>
  <text x="974.0" y="567.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">前端改从 MySQL 最终快照恢复正文</text>
  <path d="M250.0,390.0 L250.0,500.0" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-rose)"/>
  <rect x="262.0" y="436.0" width="56.0" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="290.0" y="449.0" font-size="11.5" font-weight="600" fill="#e11d48" text-anchor="middle">网络中断</text>
  <path d="M460.0,541.0 L500.0,541.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M920.0,550.0 L960.0,550.0" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <path d="M710.0,500.0 L710.0,408.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="717.5" y="445.0" width="33.0" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="734.0" y="458.0" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">补发</text>
  <rect x="40.0" y="650.0" width="1320.0" height="88.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="54.0" y="674.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">为什么这样设计</text>
  <text x="54.0" y="698.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">回答在哪个实例生成和浏览器连在哪个实例无关，Redis Stream 让任意实例都能按序号续读；按条数裁剪让单个回答的内存有上限。</text>
  <text x="54.0" y="717.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">回答正文最终以 MySQL 为准，Redis 数据丢失只影响实时性，不影响结果。</text>
</svg>
