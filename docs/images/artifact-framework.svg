<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, Helvetica, Arial, sans-serif">
  <defs><marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1400" height="960" fill="#ffffff"/>
  <text x="700.0" y="44.0" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">Schema 驱动的产物生成框架：SKILL.md 声明、Java Host 管控、Python Worker 五段流水线</text>
  <text x="700.0" y="72.0" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">新增同形态产物只加一个 SKILL.md；模型输出必须通过 Schema、引用和数字一致性校验</text>
  <rect x="24.0" y="92.0" width="1352.0" height="150.0" rx="14" fill="#f5f3ff" fill-opacity="0.55" stroke="#7c3aed" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="40.0" y="116.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">Skill 声明</text>
  <text x="125.5" y="116.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Host 与 Worker 读取同一目录</text>
  <rect x="44.0" y="132.0" width="420.0" height="82.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="58.0" y="156.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">skills/&lt;name&gt;/SKILL.md</text>
  <text x="58.0" y="180.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">形态、用户可选项、输出契约</text>
  <text x="58.0" y="199.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">新增同形态产物只需加一个目录</text>
  <rect x="490.0" y="132.0" width="420.0" height="82.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="504.0" y="156.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">schemas/*.json</text>
  <text x="504.0" y="180.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">产物内容的 JSON Schema</text>
  <text x="504.0" y="199.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">校验阶段逐项比对</text>
  <rect x="936.0" y="132.0" width="420.0" height="82.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="950.0" y="156.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">14 种产物</text>
  <text x="950.0" y="180.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">报告、简报、测验、闪卡、思维导图、时间线</text>
  <text x="950.0" y="199.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">课程笔记、演示文稿、视频 PDF 讲义等</text>
  <rect x="24.0" y="262.0" width="1352.0" height="226.0" rx="14" fill="#eef2ff" fill-opacity="0.55" stroke="#4f46e5" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="40.0" y="286.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">Java Host</text>
  <rect x="44.0" y="306.0" width="300.0" height="120.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="58.0" y="330.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">请求校验</text>
  <text x="58.0" y="354.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">选项按 Skill 声明校验</text>
  <text x="58.0" y="373.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">未给数量时从需求原文推断</text>
  <text x="58.0" y="392.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">冻结来源资料的版本</text>
  <text x="58.0" y="413.0" font-size="11" font-weight="400" fill="#4f46e5" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">ArtifactSkillCatalogService</text>
  <rect x="370.0" y="306.0" width="300.0" height="120.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
  <text x="384.0" y="330.0" font-size="14.5" font-weight="700" fill="#134e4a" text-anchor="start">并发准入</text>
  <text x="384.0" y="354.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">工作台并发租约：Redis ZSET</text>
  <text x="384.0" y="373.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">默认每工作台 4 个，租约 300 秒</text>
  <text x="384.0" y="392.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">超出时排队并显示位置</text>
  <text x="384.0" y="413.0" font-size="11" font-weight="400" fill="#0d9488" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">WorkloadQuotaService</text>
  <rect x="696.0" y="306.0" width="300.0" height="120.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="710.0" y="330.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">发件箱与投递</text>
  <text x="710.0" y="354.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">任务与发件箱同一事务</text>
  <text x="710.0" y="373.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">Kafka noteweave.artifact.job</text>
  <text x="710.0" y="392.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">失败进入死信队列</text>
  <rect x="1022.0" y="306.0" width="334.0" height="120.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="1036.0" y="330.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">候选验收与版本</text>
  <text x="1036.0" y="354.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">引用必须属于冻结的来源</text>
  <text x="1036.0" y="373.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">核对文件清单后入库</text>
  <text x="1036.0" y="392.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">产物版本化，文件存 MinIO</text>
  <text x="1036.0" y="411.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">可写回 Note，旧版本可恢复</text>
