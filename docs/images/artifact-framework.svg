  <rect x="206.0" y="251.0" width="56.0" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="234.0" y="264.0" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">选项契约</text>
  <rect x="24.0" y="508.0" width="1352.0" height="250.0" rx="14" fill="#fffbeb" fill-opacity="0.55" stroke="#d97706" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="40.0" y="532.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">Python Worker 五段流水线</text>
  <rect x="44.0" y="556.0" width="240.0" height="100.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="58.0" y="580.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">取材</text>
  <rect x="242.9" y="565.0" width="33.1" height="20.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="259.4" y="579.0" font-size="11" font-weight="400" fill="#78350f" text-anchor="middle">20%</text>
  <text x="58.0" y="604.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">按冻结来源检索证据</text>
  <text x="58.0" y="623.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">视频读取文字与关键帧</text>
  <rect x="312.0" y="556.0" width="240.0" height="100.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="326.0" y="580.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">规划</text>
  <rect x="510.9" y="565.0" width="33.1" height="20.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="527.4" y="579.0" font-size="11" font-weight="400" fill="#78350f" text-anchor="middle">35%</text>
  <text x="326.0" y="604.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">生成大纲与标题</text>
  <text x="326.0" y="623.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">标题按资料主题命名</text>
  <rect x="580.0" y="556.0" width="240.0" height="100.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="594.0" y="580.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">写作</text>
  <rect x="778.9" y="565.0" width="33.1" height="20.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="795.4" y="579.0" font-size="11" font-weight="400" fill="#78350f" text-anchor="middle">65%</text>
  <text x="594.0" y="604.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">按 Schema 生成内容</text>
  <text x="594.0" y="623.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">每条内容带证据引用</text>
  <rect x="848.0" y="556.0" width="240.0" height="100.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="862.0" y="580.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">校验</text>
  <rect x="1046.9" y="565.0" width="33.1" height="20.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="1063.4" y="579.0" font-size="11" font-weight="400" fill="#78350f" text-anchor="middle">85%</text>
  <text x="862.0" y="604.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">Schema、引用、数字一致性</text>
  <text x="862.0" y="623.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">不通过时修复一次</text>
  <rect x="1116.0" y="556.0" width="240.0" height="100.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="1130.0" y="580.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">渲染</text>
  <rect x="1308.5" y="565.0" width="39.5" height="20.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="1328.2" y="579.0" font-size="11" font-weight="400" fill="#78350f" text-anchor="middle">100%</text>
  <text x="1130.0" y="604.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">Markdown、CSV、PPTX、PDF</text>
  <text x="1130.0" y="623.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">XeLaTeX 编译讲义</text>
  <path d="M284.0,606.0 L312.0,606.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
