  <rect x="532.0" y="489.0" width="56.0" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="560.0" y="502.0" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">任务消息</text>
  <path d="M1356.0,586.0 L1366.0,586.0 L1366.0,460.0 L1189.0,460.0 L1189.0,426.0" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <rect x="1193.2" y="441.0" width="113.5" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="1250.0" y="454.0" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">候选内容与文件清单</text>
  <text x="330.0" y="690.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">多条消费通道并行处理任务，每段完成推送进度；校验不通过时把错误项交给模型修复一次，仍不通过则给出用户能看懂的失败原因。</text>
  <rect x="24.0" y="778.0" width="1352.0" height="162.0" rx="14" fill="#f5f3ff" fill-opacity="0.55" stroke="#7c3aed" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="40.0" y="802.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">媒体工具（MCP）</text>
  <rect x="44.0" y="820.0" width="620.0" height="82.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="58.0" y="844.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">media-mcp</text>
  <text x="58.0" y="868.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">B 站解析、字幕、faster-whisper 转写、抓帧、时间轴、OCR</text>
  <text x="58.0" y="887.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">Worker 通过 MCP 协议调用，转写与关键帧随资料快照保存</text>
  <rect x="690.0" y="820.0" width="666.0" height="82.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="704.0" y="844.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">视频产物</text>
  <text x="704.0" y="868.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">演示文稿每页配视频原画面，并标注时间点与字幕证据</text>
  <text x="704.0" y="887.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">PDF 讲义插入关键帧；资料没有关键帧时直接说明原因</text>
