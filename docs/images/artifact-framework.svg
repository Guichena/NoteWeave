<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">产物框架：Skill 目录声明，Java Host 编排与校验，Python Worker 生成</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#475569">新增产物类型只需在目录里声明输入、输出契约与能力需求，不改编排代码</text>

  <!-- catalog -->
  <rect x="30" y="96" width="250" height="150" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="155" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Skill 目录</text>
  <g font-size="12.5" fill="#334155">
    <text x="48" y="152">artifact-skill-catalog-v2.json</text>
    <text x="48" y="176">每种产物：输入、输出契约、</text>
    <text x="48" y="198">所需能力、导出格式、分组</text>
    <text x="48" y="226" font-size="11.5" fill="#64748b">同步脚本复制到 Backend 与 Worker</text>
  </g>

  <!-- java host -->
  <rect x="320" y="96" width="400" height="180" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="520" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">Java Host：创建与编排</text>
  <g font-size="12.5" fill="#3730a3">
    <text x="338" y="152">按发起人身份创建任务，检查配额与并发上限</text>
    <text x="338" y="176">冻结输入：资料范围、上下文快照、能力绑定</text>
    <text x="338" y="200">需要外部素材时先发起采集操作并等待回调</text>
    <text x="338" y="224">任务写入 Outbox，投递 Kafka 产物主题</text>
    <text x="338" y="256" font-size="11.5" fill="#6366f1">ArtifactJobService · ArtifactVideoMaterialService</text>
  </g>

  <!-- worker -->
  <rect x="760" y="96" width="410" height="180" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="965" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Python Worker：生成与导出</text>
  <g font-size="12.5" fill="#9a3412">
    <text x="778" y="152">按 Skill 契约组装提示词</text>
    <text x="778" y="176">OpenAI Python SDK 输出结构化 JSON</text>
    <text x="778" y="200">结果按内容模型（Pydantic）校验结构</text>
    <text x="778" y="224">导出：python-pptx、XeLaTeX、reportlab</text>
    <text x="778" y="256" font-size="11.5" fill="#ea580c">generation_runtime · export_runtime</text>
  </g>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="280" y1="170" x2="318" y2="170" marker-end="url(#arrow)"/>
    <line x1="720" y1="170" x2="758" y2="170" marker-end="url(#arrow)"/>
  </g>
  <text x="739" y="160" text-anchor="middle" font-size="11" fill="#475569">Kafka</text>

  <!-- MCP -->
  <rect x="760" y="316" width="410" height="196" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="965" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">系统 MCP 服务端（官方 MCP SDK，stdio）</text>
  <g font-size="12.5" fill="#854d0e">
    <text x="778" y="372">get_bilibili_subtitle：字幕，必要时下载音轨转写</text>
    <text x="778" y="396">transcribe_local_audio：faster-whisper 转写</text>
    <text x="778" y="420">capture_bilibili_frames：按时间点抓帧</text>
    <text x="778" y="444">analyze_frames：校验摘要后做画面 OCR</text>
    <text x="778" y="468">render_latex_pdf：编译 PDF 讲义</text>
  </g>
  <text x="965" y="496" text-anchor="middle" font-size="11.5" fill="#a16207">参数按 inputSchema 校验，文件只能读写沙箱目录</text>
  <path d="M965,276 L965,314" stroke="#475569" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- callback & versions -->
  <rect x="320" y="316" width="400" height="196" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="520" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">回调、复核与版本化</text>
  <g font-size="12.5" fill="#047857">
    <text x="338" y="372">Worker 通过带令牌和签名的内部接口回调</text>
    <text x="338" y="396">Host 复核契约、证据覆盖与冻结素材摘要</text>
    <text x="338" y="420">通过后生成新版本，可重新生成、对比</text>
    <text x="338" y="444">从 Worker 拉取导出文件存入 MinIO</text>
    <text x="338" y="468">可下载、存为资料、写入 Note 或 Wiki</text>
  </g>
  <path d="M760,404 L722,404" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="741" y="394" text-anchor="middle" font-size="11" fill="#475569">回调</text>

  <rect x="30" y="316" width="250" height="196" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="155" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">已接入的产物</text>
  <g font-size="12.5" fill="#3730a3">
    <text x="48" y="372">基于资料：报告、思维导图、测验、</text>
    <text x="48" y="394">学习指南、精读摘要、FAQ 等</text>
    <text x="48" y="420">音视频：音频纪要、课程笔记</text>
    <text x="48" y="446">视频学习：视频摘要、知识博客、</text>
    <text x="48" y="468">面试问答、学习 PPTX、PDF 讲义</text>
  </g>
  <path d="M320,404 L282,404" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="600" y="560" text-anchor="middle" font-size="13" fill="#475569">Worker 不直接写 Java 业务表；生成过程、MCP 调用和校验结果记录在产物的生成过程里，可在界面中展开查看</text>
  <text x="600" y="586" text-anchor="middle" font-size="13" fill="#475569">视频产物共用同一份冻结素材，由后台协调器按发起人身份分别创建任务</text>
</svg>
