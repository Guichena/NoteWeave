  <text x="700.0" y="44.0" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">一轮回答的上下文拼装：改写模型判断话题，冻结后拼接提示</text>
  <text x="700.0" y="72.0" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">改写在冻结之前完成，同一次调用给出话题编号与独立查询；没有判断时按规则与向量切分</text>
