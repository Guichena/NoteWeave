  <rect width="1400" height="960" fill="#ffffff"/>
  <text x="700.0" y="44.0" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">一轮回答的上下文拼装：后台增量维护、冻结、改写与提示拼接</text>
  <text x="700.0" y="72.0" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">发消息接口立即返回；约束、话题和摘要在后台增量维护，本轮只读取已经落库的结果</text>
