  <text x="44.0" y="924.0" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">事实只来自资料片段；话题摘要、约束和记忆只用于理解追问和决定表达方式。话题判断与每项的入选、排除原因都写入冻结快照，可在上下文检查器中查看。</text>
