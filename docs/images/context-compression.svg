  <text x="405.8" y="330.0" font-size="12" font-weight="400" fill="#475569" text-anchor="start">排除</text>
  <text x="500.0" y="330.0" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start">例：当前问题在第 24 条之后，上下文 = 段 1 摘要 v2 + 段 2 摘要 + 段 3 摘要（15-16）+ 原文 17-24</text>
  <rect x="40.0" y="362.0" width="420.0" height="166.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="54.0" y="386.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">原文尾部怎么定</text>
  <text x="54.0" y="410.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">从最新一条往前数，至少 2 条、最多 8 条</text>
  <text x="54.0" y="429.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">累计超过 6000 token 或总预算一半就停</text>
  <text x="54.0" y="448.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">短消息保留满 8 条，长回答只留最近几轮</text>
  <text x="54.0" y="467.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">摘要任务用同一规则决定覆盖终点</text>
  <text x="54.0" y="488.0" font-size="11" font-weight="400" fill="#4f46e5" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">ContextWindowPlannerV2.rawTailSize</text>
  <rect x="490.0" y="362.0" width="420.0" height="166.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="504.0" y="386.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">当前话题的摘要落后时</text>
  <text x="504.0" y="410.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">已覆盖到原文尾部之前：直接使用</text>
  <text x="504.0" y="429.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">落后 1～8 条：原文向前补到摘要终点之后</text>
  <text x="504.0" y="448.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">落后更多或还没有摘要：展开本段原文</text>
  <text x="504.0" y="467.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">仍超长：先按 256 条、再按预算裁掉最旧</text>
  <text x="504.0" y="486.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">至少保留最新一条，只记降级不阻断</text>
  <rect x="940.0" y="362.0" width="420.0" height="166.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="954.0" y="386.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">摘要怎么选</text>
  <text x="954.0" y="410.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">每段取覆盖到原文尾部之前的最新一版</text>
  <text x="954.0" y="429.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">目标话题的各段优先，最近的其他话题再带一个</text>
  <text x="954.0" y="448.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">话题归属不确定时不引入同话题其他段</text>
  <text x="954.0" y="467.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">与原文重叠或范围过期的版本排除，超预算记降级</text>
  <text x="954.0" y="486.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">回到旧话题带段尾原文（最多 4 条）</text>
  <text x="954.0" y="505.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">问到早先细节时按话题回放原文（最多 3 组）</text>
