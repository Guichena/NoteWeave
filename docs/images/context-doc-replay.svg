<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, Helvetica, Arial, sans-serif">
  <defs><marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1400" height="700" fill="#ffffff"/>
  <text x="700.0" y="44.0" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">话题摘要带出处，需要细节时按出处回放原文</text>
  <text x="700.0" y="72.0" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">摘要是折叠后的短结果，每条要点记下来源消息序号；原文一直在库里，回放只按序号读取</text>
  <rect x="24.0" y="96.0" width="360.0" height="568.0" rx="14" fill="#f8fafc" fill-opacity="0.55" stroke="#64748b" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="40.0" y="120.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">会话消息（MySQL）</text>
  <rect x="44.0" y="140.0" width="320.0" height="50.0" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.1"/>
  <text x="58.0" y="171.0" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="start">#1-#2</text>
  <text x="132.0" y="171.0" font-size="13" font-weight="400" fill="#334155" text-anchor="start">方法、压缩率和效果</text>
  <rect x="44.0" y="202.0" width="320.0" height="50.0" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.1"/>
  <text x="58.0" y="233.0" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="start">#3-#4</text>
  <text x="132.0" y="233.0" font-size="13" font-weight="400" fill="#334155" text-anchor="start">多跳问答谁掉得少</text>
  <rect x="44.0" y="264.0" width="320.0" height="50.0" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.1"/>
  <text x="58.0" y="295.0" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="start">#5-#6</text>
  <text x="132.0" y="295.0" font-size="13" font-weight="400" fill="#334155" text-anchor="start">实验用的什么模型</text>
  <rect x="44.0" y="326.0" width="320.0" height="50.0" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.1"/>
  <text x="58.0" y="357.0" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="start">#7-#8</text>
  <text x="132.0" y="357.0" font-size="13" font-weight="400" fill="#334155" text-anchor="start">对比表提纲</text>
  <rect x="44.0" y="388.0" width="320.0" height="50.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <text x="58.0" y="419.0" font-size="13" font-weight="700" fill="#78350f" text-anchor="start">#9-#10</text>
  <text x="132.0" y="419.0" font-size="13" font-weight="400" fill="#334155" text-anchor="start">GB/T 7714 还是 APA</text>
  <rect x="44.0" y="450.0" width="320.0" height="50.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <text x="58.0" y="481.0" font-size="13" font-weight="700" fill="#78350f" text-anchor="start">#11-#12</text>
  <text x="132.0" y="481.0" font-size="13" font-weight="400" fill="#334155" text-anchor="start">按作者还是按出现顺序</text>
  <rect x="44.0" y="512.0" width="320.0" height="50.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.1"/>
  <text x="58.0" y="543.0" font-size="13" font-weight="700" fill="#78350f" text-anchor="start">#13-#14</text>
  <text x="132.0" y="543.0" font-size="13" font-weight="400" fill="#334155" text-anchor="start">英文文献要不要翻译</text>
  <rect x="44.0" y="574.0" width="320.0" height="50.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.1"/>
  <text x="58.0" y="605.0" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">#15</text>
  <text x="132.0" y="605.0" font-size="13" font-weight="400" fill="#334155" text-anchor="start">乙准确率掉了多少来着</text>
  <text x="204.0" y="640.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">蓝色：论文梳理话题  橙色：引用格式话题</text>
  <rect x="408.0" y="96.0" width="470.0" height="568.0" rx="14" fill="#f0f9ff" fill-opacity="0.55" stroke="#0284c7" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="424.0" y="120.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">论文梳理话题的摘要</text>
  <text x="560.5" y="120.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Kafka 增量生成</text>
  <rect x="428.0" y="140.0" width="430.0" height="70.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="442.0" y="164.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">第 1 版 · 覆盖 #1-#4</text>
  <text x="442.0" y="188.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">由 #1-#4 生成</text>
  <rect x="428.0" y="238.0" width="430.0" height="196.0" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="442.0" y="262.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">第 2 版 · 覆盖 #1-#8（当前就绪）</text>
  <text x="442.0" y="286.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">目标：为综述比较三篇论文，整理成对比表</text>
  <text x="442.0" y="305.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">已定结论：甲 prompt pruning 4 倍，</text>
  <text x="442.0" y="324.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">乙摘要式压缩 8 倍，丙 KV cache 16 倍〔#2〕</text>
  <text x="442.0" y="343.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">多跳问答上乙下降最少〔#4〕</text>
  <text x="442.0" y="362.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">实验模型均为 7B 级〔#6〕</text>
  <text x="442.0" y="381.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">对比表按方法、压缩率、效果、开销四列〔#8〕</text>
  <text x="442.0" y="400.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">未决问题：丙的显存开销还没核对</text>
  <path d="M643.0,210.0 L643.0,238.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="649.2" y="225.0" width="107.5" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="703.0" y="238.0" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">只读新增的 #5-#8</text>
  <rect x="428.0" y="462.0" width="430.0" height="124.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="442.0" y="486.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">生成规则</text>
  <text x="442.0" y="510.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">按固定小节输出：目标、已定结论、</text>
  <text x="442.0" y="529.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">关键数字与清单、未决问题</text>
  <text x="442.0" y="548.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">每条要点末尾标注来源消息序号</text>
  <text x="442.0" y="567.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">新内容与旧摘要冲突时以新内容为准</text>
  <text x="643.0" y="618.0" font-size="12" font-weight="400" fill="#b45309" text-anchor="middle">小节、〔#n〕出处属于本轮设计，现有摘要为自由要点</text>
  <rect x="902.0" y="96.0" width="474.0" height="568.0" rx="14" fill="#fffbeb" fill-opacity="0.55" stroke="#d97706" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="918.0" y="120.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">需要细节时的两级定位</text>
  <text x="1069.0" y="120.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">只在目标话题内找</text>
  <rect x="922.0" y="140.0" width="434.0" height="84.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="936.0" y="164.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">改写结果</text>
  <text x="936.0" y="188.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">r：回到论文梳理话题    d=1：需要细节</text>
  <text x="936.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">s：论文乙 8 倍压缩下的准确率下降幅度</text>
  <rect x="922.0" y="254.0" width="434.0" height="84.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="936.0" y="278.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">① 在目标话题摘要的要点里匹配</text>
  <text x="936.0" y="302.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">命中：乙摘要式压缩 8 倍〔#2〕</text>
  <text x="936.0" y="321.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">摘要只留了压缩率，准确率数字已被折叠</text>
  <rect x="922.0" y="368.0" width="434.0" height="84.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="936.0" y="392.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">② 按出处读原文</text>
  <text x="936.0" y="416.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">#2 所在的一组问答：#1 用户提问、#2 回答</text>
  <text x="936.0" y="435.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">已在原文尾部的消息跳过</text>
  <rect x="922.0" y="482.0" width="434.0" height="84.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="936.0" y="506.0" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="start">放进上下文（话题块下方）</text>
  <text x="936.0" y="530.0" font-size="12.5" font-weight="400" fill="#047857" text-anchor="start">最多 3 组问答，合计不超过 1500 token</text>
  <text x="936.0" y="549.0" font-size="12.5" font-weight="400" fill="#047857" text-anchor="start">快照记下入选原因：话题原文回放</text>
  <path d="M1139.0,224.0 L1139.0,254.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M1139.0,338.0 L1139.0,368.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M1139.0,452.0 L1139.0,482.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <text x="1139.0" y="606.0" font-size="12.5" font-weight="400" fill="#9a3412" text-anchor="middle">退路：没有命中要点，或旧摘要没有出处时，</text>
  <text x="1139.0" y="626.0" font-size="12.5" font-weight="400" fill="#9a3412" text-anchor="middle">按独立查询与原文的词项重合度打分（现有实现）</text>
  <path d="M860.0,300.0 L922.0,296.0" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-sky)"/>
</svg>
