<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, Helvetica, Arial, sans-serif">
  <defs><marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1400" height="940" fill="#ffffff"/>
  <text x="700.0" y="44.0" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">任务感知的 QA / Note / Wiki 知识链路</text>
  <text x="700.0" y="72.0" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">三种回答模式按需求粒度选择检索方式，共用范围校验、撤销过滤、有效性复核和证据预算</text>
  <rect x="450.0" y="96.0" width="500.0" height="82.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="700.0" y="120.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">独立查询与范围</text>
  <text x="700.0" y="144.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">渐进改写得到可独立检索的查询</text>
  <text x="700.0" y="163.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">限定在本工作台、所选资料范围内</text>
  <rect x="40.0" y="206.0" width="420.0" height="580.0" rx="14" fill="#f0f9ff" fill-opacity="0.55" stroke="#0284c7" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="56.0" y="230.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">问答 QA</text>
  <text x="116.2" y="230.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">快速事实查询</text>
  <rect x="490.0" y="206.0" width="420.0" height="580.0" rx="14" fill="#f0fdfa" fill-opacity="0.55" stroke="#0d9488" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="506.0" y="230.0" font-size="14.5" font-weight="700" fill="#134e4a" text-anchor="start">精读 Note</text>
  <text x="583.0" y="230.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">长文档连续阅读</text>
  <rect x="940.0" y="206.0" width="420.0" height="580.0" rx="14" fill="#f5f3ff" fill-opacity="0.55" stroke="#7c3aed" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="956.0" y="230.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">知识库 Wiki</text>
  <text x="1047.5" y="230.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">跨资料知识整合</text>
  <rect x="60.0" y="244.0" width="380.0" height="100.0" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="74.0" y="268.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">并行召回</text>
  <text x="74.0" y="292.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">ES BM25：中文按相邻两字切词</text>
  <text x="74.0" y="311.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">ES kNN 向量召回</text>
  <text x="74.0" y="330.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">两路在线程池里并行执行</text>
  <rect x="60.0" y="362.0" width="380.0" height="82.0" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="74.0" y="386.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">RRF 融合与补召回</text>
  <text x="74.0" y="410.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">按名次融合两路结果</text>
  <text x="74.0" y="429.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">命中少于 3 条时用备选查询补召回</text>
  <path d="M250.0,344.0 L250.0,362.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="60.0" y="462.0" width="380.0" height="140.0" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="74.0" y="486.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">Rerank 精排</text>
  <text x="74.0" y="510.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">交互式回答单次总预算 6 秒</text>
  <text x="74.0" y="529.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">超时换新连接重试，失败后冷却 30 秒</text>
  <text x="74.0" y="548.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">冷却期内直接用未重排结果</text>
  <text x="74.0" y="569.0" font-size="11" font-weight="400" fill="#0284c7" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">OpenAiCompatibleRerankClient</text>
  <path d="M250.0,444.0 L250.0,462.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="60.0" y="622.0" width="380.0" height="64.0" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="74.0" y="646.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">片段证据</text>
  <text x="74.0" y="670.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">相邻段落只取靠近命中处的 300 字</text>
  <path d="M250.0,602.0 L250.0,622.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M510.0,178.0 L510.0,194.0 L250.0,194.0 L250.0,244.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="510.0" y="244.0" width="380.0" height="100.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
  <text x="524.0" y="268.0" font-size="14.5" font-weight="700" fill="#134e4a" text-anchor="start">资料级召回</text>
  <text x="524.0" y="292.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">先选出与问题相关的资料</text>
  <text x="524.0" y="311.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">会话工作集里的资料加权</text>
  <rect x="510.0" y="362.0" width="380.0" height="82.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
  <text x="524.0" y="386.0" font-size="14.5" font-weight="700" fill="#134e4a" text-anchor="start">窗口打分</text>
  <text x="524.0" y="410.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">向量命中与重排为候选窗口打分</text>
  <text x="524.0" y="429.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">按阅读角色与得分选出窗口</text>
  <path d="M700.0,344.0 L700.0,362.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="510.0" y="462.0" width="380.0" height="140.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
  <text x="524.0" y="486.0" font-size="14.5" font-weight="700" fill="#134e4a" text-anchor="start">连续原文窗口</text>
  <text x="524.0" y="510.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">按原文顺序读取连续窗口</text>
  <text x="524.0" y="529.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">回答说明窗口覆盖到哪里</text>
  <text x="524.0" y="550.0" font-size="11" font-weight="400" fill="#0d9488" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">NoteReadingRetriever</text>
  <path d="M700.0,444.0 L700.0,462.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="510.0" y="622.0" width="380.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
  <text x="524.0" y="646.0" font-size="14.5" font-weight="700" fill="#134e4a" text-anchor="start">原文窗口证据</text>
  <text x="524.0" y="670.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">整段原文，不拼接零散片段</text>
  <path d="M700.0,602.0 L700.0,622.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M700.0,178.0 L700.0,194.0 L700.0,194.0 L700.0,244.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="960.0" y="244.0" width="380.0" height="100.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="974.0" y="268.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">BM25F 页面检索</text>
  <text x="974.0" y="292.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">标题 3、摘要 2、正文 1 加权</text>
  <text x="974.0" y="311.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">IDF 在本工作台全部页面上统计</text>
  <rect x="960.0" y="362.0" width="380.0" height="82.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="974.0" y="386.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">沿链接传播一次</text>
  <text x="974.0" y="410.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">高分页面把 35% 得分传给相邻页</text>
  <text x="974.0" y="429.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">被引用、反链多的页面小幅加成</text>
  <path d="M1150.0,344.0 L1150.0,362.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="960.0" y="462.0" width="380.0" height="140.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="974.0" y="486.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">命中判定与截断</text>
  <text x="974.0" y="510.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">覆盖足够比例的查询词才算命中</text>
  <text x="974.0" y="529.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">去掉明显低于最高分的长尾</text>
  <text x="974.0" y="548.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">没有页面命中时如实返回空</text>
  <text x="974.0" y="569.0" font-size="11" font-weight="400" fill="#7c3aed" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">KnowledgeWikiSearchEngine</text>
  <path d="M1150.0,444.0 L1150.0,462.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="960.0" y="622.0" width="380.0" height="64.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="974.0" y="646.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">页面与来源回链</text>
  <text x="974.0" y="670.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">沿知识网络展开，遍历受预算约束</text>
  <path d="M1150.0,602.0 L1150.0,622.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M890.0,178.0 L890.0,194.0 L1150.0,194.0 L1150.0,244.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="960.0" y="696.0" width="380.0" height="82.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="974.0" y="720.0" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="start">知识页编译</text>
  <text x="974.0" y="744.0" font-size="11.5" font-weight="400" fill="#5b21b6" text-anchor="start">资料就绪后经 Kafka 编译知识页；模型规划在事务外，</text>
  <text x="974.0" y="763.0" font-size="11.5" font-weight="400" fill="#5b21b6" text-anchor="start">短事务复核输入一致后写入，变化时重新规划</text>
  <rect x="40.0" y="806.0" width="650.0" height="104.0" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="54.0" y="830.0" font-size="14.5" font-weight="700" fill="#881337" text-anchor="start">撤销过滤与有效性复核</text>
  <text x="54.0" y="854.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">ES 查询按 Redis 墓碑排除已撤销资料，已撤销片段不占 TopK 名额（见下一张图）</text>
  <text x="54.0" y="873.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">召回后按主键批量回查 MySQL：资料未删除、快照仍是当前版本</text>
  <text x="54.0" y="892.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">复核不通过的证据不进入提示，并记入 ownership_rejected_count</text>
  <rect x="710.0" y="806.0" width="650.0" height="104.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="724.0" y="830.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">证据预算与生成</text>
  <text x="724.0" y="854.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">三种模式共用证据预算；证据编号与引用卡片一一对应</text>
  <text x="724.0" y="873.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">生成提示只允许引用本轮证据，不补写资料里没有的事实</text>
  <text x="724.0" y="892.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">研究报告引用过的网页原文也可作为问答证据</text>
  <path d="M250.0,686.0 L250.0,806.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M700.0,686.0 L700.0,796.0 L600.0,796.0 L600.0,806.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M960.0,654.0 L925.0,654.0 L925.0,806.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M690.0,858.0 L710.0,858.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
</svg>
