  <rect width="1400" height="960" fill="#ffffff"/>
  <text x="700.0" y="44.0" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">Deep Research Agent：研究表驱动的规划、执行与分层验证</text>
  <text x="700.0" y="72.0" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">Backend 持有研究表与全部判定；Worker 无状态，只提交候选与证据；租约与 fencing token 拒绝过期写回</text>
  <rect x="24.0" y="92.0" width="1352.0" height="418.0" rx="14" fill="#eef2ff" fill-opacity="0.55" stroke="#4f46e5" stroke-width="1.1" stroke-dasharray="6 5"/>
