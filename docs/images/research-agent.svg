  <rect x="44.0" y="772.0" width="1312.0" height="86.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="58.0" y="796.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">工具与边界</text>
  <text x="58.0" y="820.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">联网检索（Serper 与 MCP 搜索）、网页快照、原文抽取与本地校验；每个角色只能使用声明过的工具。</text>
