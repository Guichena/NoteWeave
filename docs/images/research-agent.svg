  <text x="156.8" y="116.0" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">研究状态全部落在 MySQL 账本，判定由 Backend 作出</text>
  <rect x="44.0" y="132.0" width="250.0" height="116.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="58.0" y="156.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">研究问题与计划</text>
  <rect x="250.0" y="141.0" width="36.0" height="20.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="268.0" y="155.0" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="middle">模型</text>
  <text x="58.0" y="180.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">PLANNING 角色提出计划提案</text>
  <text x="58.0" y="199.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">研究对象 × 待验证字段</text>
  <text x="58.0" y="218.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">Backend 校验后写入研究表</text>
