  <text x="384.0" y="241.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">对象 B</text>
  <rect x="432.0" y="224.0" width="84.0" height="26.0" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="474.0" y="241.5" font-size="12" font-weight="400" fill="#065f46" text-anchor="middle">已验证</text>
  <rect x="522.0" y="224.0" width="84.0" height="26.0" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1"/>
  <text x="564.0" y="241.5" font-size="12" font-weight="400" fill="#881337" text-anchor="middle">冲突</text>
  <rect x="612.0" y="224.0" width="84.0" height="26.0" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <text x="654.0" y="241.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">缺口</text>
  <rect x="342.0" y="256.0" width="84.0" height="26.0" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="384.0" y="273.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">对象 C</text>
  <rect x="432.0" y="256.0" width="84.0" height="26.0" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="474.0" y="273.5" font-size="12" font-weight="400" fill="#78350f" text-anchor="middle">候选</text>
  <rect x="522.0" y="256.0" width="84.0" height="26.0" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <text x="564.0" y="273.5" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">缺口</text>
  <rect x="612.0" y="256.0" width="84.0" height="26.0" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="654.0" y="273.5" font-size="12" font-weight="400" fill="#065f46" text-anchor="middle">已验证</text>
  <text x="342.0" y="294.0" font-size="12" font-weight="400" fill="#3730a3" text-anchor="start">每格独立记录候选、证据、判定与版本号</text>
  <rect x="730.0" y="132.0" width="300.0" height="136.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="744.0" y="156.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">协调器 tick</text>
  <text x="744.0" y="180.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">为缺口格与冲突格生成子任务</text>
  <text x="744.0" y="199.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">按预算与修复上限决定是否补查</text>
  <text x="744.0" y="218.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">命令先写发件箱，再投递 Kafka</text>
  <text x="744.0" y="239.0" font-size="11" font-weight="400" fill="#4f46e5" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">ResearchAgentCoordinatorTickService</text>
  <rect x="1072.0" y="132.0" width="284.0" height="136.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
  <text x="1086.0" y="156.0" font-size="14.5" font-weight="700" fill="#134e4a" text-anchor="start">并发控制</text>
  <text x="1086.0" y="180.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">工作台研究槽位：Redis ZSET 租约</text>
  <text x="1086.0" y="199.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">分值为到期时间，过期自动回收</text>
  <text x="1086.0" y="218.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">子任务：lease_epoch + fencing token</text>
  <text x="1086.0" y="237.0" font-size="12.5" font-weight="400" fill="#115e59" text-anchor="start">过期执行者的写回一律拒绝</text>
  <rect x="44.0" y="330.0" width="300.0" height="160.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="58.0" y="354.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">完成提交（单一事务）</text>
  <text x="58.0" y="378.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">加锁顺序固定：run → task →</text>
  <text x="58.0" y="397.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">完成记录 → 预算预留 → 格 → 子键</text>
  <text x="58.0" y="416.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">合并 SQL 同时比对格版本、</text>
  <text x="58.0" y="435.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">租约代次与 fencing token</text>
  <text x="58.0" y="456.0" font-size="11" font-weight="400" fill="#4f46e5" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">ResearchAgentCompletionCommitter</text>
  <rect x="370.0" y="330.0" width="340.0" height="160.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="384.0" y="354.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">分层 Verifier</text>
  <text x="384.0" y="378.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">格级：支持 / 部分支持 / 矛盾 / 不足</text>
  <text x="384.0" y="397.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">全局：跨格冲突检测，标为 CONFLICTED</text>
  <text x="384.0" y="416.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">引用：先比原文片段与数字、日期，</text>
  <text x="384.0" y="435.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">再由模型判蕴含，模型不可用按词项兜底</text>
  <rect x="736.0" y="330.0" width="310.0" height="160.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="750.0" y="354.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">局部重规划</text>
  <text x="750.0" y="378.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">从失败、过期的任务快照推出缺口</text>
  <text x="750.0" y="397.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">缺口：格级补查，次数有上限</text>
  <text x="750.0" y="416.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">冲突：有界的反证任务</text>
  <text x="750.0" y="435.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">审计偏差类型、受影响格与预算变化</text>
  <rect x="1072.0" y="330.0" width="284.0" height="160.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="1086.0" y="354.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">检查点与完成门</text>
  <text x="1086.0" y="378.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">每波写账本快照与内容摘要</text>
  <text x="1086.0" y="397.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">恢复时校验摘要，只重做缺口</text>
  <text x="1086.0" y="416.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">仅基础设施不可用才判失败</text>
  <text x="1086.0" y="435.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">证据不足如实写进报告</text>
