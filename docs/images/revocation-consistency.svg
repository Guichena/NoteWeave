<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 812" width="1400" height="812" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, Helvetica, Arial, sans-serif">
  <defs><marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1400" height="812" fill="#ffffff"/>
  <text x="700.0" y="44.0" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">资料撤销：墓碑提前排除、MySQL 批量复核、版本号隔离过期缓存</text>
  <text x="700.0" y="72.0" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">ES 片段异步删除，删除完成前旧片段仍可能被召回；三层机制分别负责召回名额、正确性和缓存</text>
  <rect x="24.0" y="92.0" width="1352.0" height="330.0" rx="14" fill="#fff1f2" fill-opacity="0.55" stroke="#e11d48" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="40.0" y="116.0" font-size="14.5" font-weight="700" fill="#881337" text-anchor="start">撤销（写路径）</text>
  <rect x="44.0" y="150.0" width="220.0" height="64.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="58.0" y="174.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">用户删除资料</text>
  <text x="58.0" y="198.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">删除接口写入撤销请求</text>
  <rect x="292.0" y="132.0" width="320.0" height="100.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="306.0" y="156.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">MySQL 删除事务</text>
  <text x="306.0" y="180.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">资料标为已删除</text>
  <text x="306.0" y="199.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">写入 ES 清理任务</text>
  <text x="306.0" y="218.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">发布 SourceDeletedEvent</text>
  <rect x="292.0" y="296.0" width="320.0" height="82.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="306.0" y="320.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">目录版本号 +1</text>
  <text x="306.0" y="344.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">提交后用单独事务递增</text>
  <text x="306.0" y="363.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">资料目录缓存的键随之改变（见下方）</text>
  <rect x="660.0" y="122.0" width="330.0" height="122.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="674.0" y="146.0" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="start">Redis 墓碑</text>
  <text x="674.0" y="170.0" font-size="12.5" font-weight="400" fill="#047857" text-anchor="start">按工作台写一个有序集合</text>
  <text x="674.0" y="189.0" font-size="12.5" font-weight="400" fill="#047857" text-anchor="start">成员为资料 ID，分值为到期时间</text>
  <text x="674.0" y="208.0" font-size="12.5" font-weight="400" fill="#047857" text-anchor="start">默认保留 24 小时，失败只记指标</text>
  <text x="674.0" y="229.0" font-size="11" font-weight="400" fill="#059669" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">RevokedSourceTombstones</text>
  <rect x="1030.0" y="122.0" width="326.0" height="140.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="1044.0" y="146.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">ES 异步清理</text>
  <text x="1044.0" y="170.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">删除 QA 片段与精读资料投影</text>
  <text x="1044.0" y="189.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">失败按退避重试</text>
  <text x="1044.0" y="208.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">每次执行前先给墓碑续期，</text>
  <text x="1044.0" y="227.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">也挡住删除后迟到的投影写入</text>
  <text x="1044.0" y="248.0" font-size="11" font-weight="400" fill="#d97706" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">SourceDeletionCleanupListener</text>
  <path d="M264.0,182.0 L292.0,182.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M612.0,183.0 L660.0,183.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="613.8" y="164.0" width="44.5" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="636.0" y="177.0" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">提交后</text>
  <path d="M452.0,232.0 L452.0,296.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="463.8" y="259.0" width="44.5" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="486.0" y="272.0" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">提交后</text>
  <path d="M452.0,132.0 L452.0,108.0 L1193.0,108.0 L1193.0,122.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="872.0" y="99.0" width="56.0" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="900.0" y="112.0" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">清理任务</text>
  <path d="M1030.0,162.0 L990.0,153.0" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-emerald)"/>
  <rect x="993.5" y="138.5" width="33.0" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="1010.0" y="151.5" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">续期</text>
  <rect x="24.0" y="442.0" width="1352.0" height="180.0" rx="14" fill="#f0f9ff" fill-opacity="0.55" stroke="#0284c7" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="40.0" y="466.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">检索（读路径）</text>
  <rect x="44.0" y="492.0" width="200.0" height="64.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="58.0" y="516.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">问题</text>
  <text x="58.0" y="540.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">改写后的独立查询</text>
  <rect x="270.0" y="484.0" width="300.0" height="100.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="284.0" y="508.0" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="start">读取墓碑</text>
  <text x="284.0" y="532.0" font-size="12.5" font-weight="400" fill="#047857" text-anchor="start">先删除已过期的成员</text>
  <text x="284.0" y="551.0" font-size="12.5" font-weight="400" fill="#047857" text-anchor="start">再取未过期的资料 ID</text>
  <text x="284.0" y="570.0" font-size="12.5" font-weight="400" fill="#047857" text-anchor="start">Redis 出错时返回空集</text>
  <rect x="596.0" y="484.0" width="360.0" height="100.0" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="610.0" y="508.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">ES 召回</text>
  <text x="610.0" y="532.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">向量与关键词召回共用作用域过滤</text>
  <text x="610.0" y="551.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">must_not terms source_id 排除</text>
  <text x="610.0" y="570.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">已撤销资料不再占 TopK 名额</text>
  <rect x="982.0" y="476.0" width="374.0" height="124.0" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="996.0" y="500.0" font-size="14.5" font-weight="700" fill="#881337" text-anchor="start">MySQL 批量复核（权威）</text>
  <text x="996.0" y="524.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">按片段主键批量回查资料与快照</text>
  <text x="996.0" y="543.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">资料未删除且快照为当前版本才保留</text>
  <text x="996.0" y="562.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">Redis 故障时它仍会拒绝已撤销资料</text>
  <text x="996.0" y="581.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">拒绝条数记为 ownership_rejected_count</text>
  <path d="M244.0,524.0 L270.0,524.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M570.0,534.0 L596.0,534.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M956.0,534.0 L982.0,534.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M825.0,244.0 L825.0,430.0 L420.0,430.0 L420.0,484.0" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <rect x="549.2" y="421.0" width="21.5" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="560.0" y="434.0" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">读</text>
  <rect x="24.0" y="642.0" width="1352.0" height="150.0" rx="14" fill="#eef2ff" fill-opacity="0.55" stroke="#4f46e5" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="40.0" y="666.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">缓存（资料目录）</text>
  <rect x="44.0" y="688.0" width="420.0" height="82.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="58.0" y="712.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">读取</text>
  <text x="58.0" y="736.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">先取当前目录版本号</text>
  <text x="58.0" y="755.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">再按 工作台 + 版本号 读缓存</text>
  <rect x="490.0" y="688.0" width="420.0" height="82.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="504.0" y="712.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">未命中</text>
  <text x="504.0" y="736.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">查库后写到读取时那个版本号的键</text>
  <text x="504.0" y="755.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">快照里也记着版本号，读取时再核对</text>
  <rect x="936.0" y="688.0" width="420.0" height="82.0" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="950.0" y="712.0" font-size="14.5" font-weight="700" fill="#881337" text-anchor="start">删除之后</text>
  <text x="950.0" y="736.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">版本号已变，读取改用新键</text>
  <text x="950.0" y="755.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">过期结果只会落在旧键上，不会被命中</text>
  <path d="M464.0,729.0 L490.0,729.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M910.0,729.0 L936.0,729.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
</svg>
