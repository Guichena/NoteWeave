<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, Helvetica, Arial, sans-serif">
  <defs><marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="700.0" y="44.0" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle">资料异步处理流水线：分阶段 Kafka 任务与幂等重试</text>
  <text x="700.0" y="72.0" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">上传只负责收文件；解析、切片、向量化、索引拆成独立阶段，阶段之间只传快照 ID</text>
  <rect x="40.0" y="104.0" width="280.0" height="120.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="54.0" y="128.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">分片上传</text>
  <text x="54.0" y="152.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">单文件最大 128 MB</text>
  <text x="54.0" y="171.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">流式读取，固定大小缓冲区</text>
  <text x="54.0" y="190.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">边读边校验格式与大小</text>
  <text x="54.0" y="211.0" font-size="11" font-weight="400" fill="#64748b" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">UploadSecurityPolicy</text>
  <rect x="346.0" y="104.0" width="230.0" height="82.0" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="360.0" y="128.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">MinIO</text>
  <text x="360.0" y="152.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">原始文件与大对象</text>
  <text x="360.0" y="171.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">阶段之间按对象路径交接</text>
  <rect x="602.0" y="104.0" width="330.0" height="100.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="616.0" y="128.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">资料与快照（MySQL）</text>
  <text x="616.0" y="152.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">资料版本不可变</text>
  <text x="616.0" y="171.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">阶段任务写入发件箱，与业务数据同事务</text>
  <text x="616.0" y="190.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">发件箱投递 Kafka，失败重投</text>
  <rect x="958.0" y="104.0" width="400.0" height="100.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="972.0" y="128.0" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="start">media-mcp（MCP 服务）</text>
  <text x="972.0" y="152.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">B 站解析、字幕、faster-whisper 转写</text>
  <text x="972.0" y="171.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">抓帧、时间轴、OCR</text>
  <text x="972.0" y="190.0" font-size="12.5" font-weight="400" fill="#5b21b6" text-anchor="start">转写结果由模型逐批校对识别错误</text>
  <path d="M320.0,145.0 L346.0,145.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M576.0,145.0 L602.0,145.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="24.0" y="270.0" width="1352.0" height="210.0" rx="14" fill="#fffbeb" fill-opacity="0.55" stroke="#d97706" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="40.0" y="294.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">Kafka 阶段任务</text>
  <rect x="40.0" y="316.0" width="300.0" height="122.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="54.0" y="340.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">解析</text>
  <text x="54.0" y="364.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">parse-worker（Docling）转换文档</text>
  <text x="54.0" y="383.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">扫描页按需 OCR，保留页码与位置</text>
  <text x="54.0" y="402.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">音视频调用 media-mcp 转写</text>
  <text x="54.0" y="423.0" font-size="11" font-weight="400" fill="#d97706" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">noteweave.source.parse</text>
  <rect x="380.0" y="316.0" width="300.0" height="122.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="394.0" y="340.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">切片</text>
  <text x="394.0" y="364.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">按结构切成检索片段</text>
  <text x="394.0" y="383.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">生成精读用的原文窗口</text>
  <text x="394.0" y="404.0" font-size="11" font-weight="400" fill="#d97706" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">noteweave.source.chunk</text>
  <rect x="720.0" y="316.0" width="300.0" height="122.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="734.0" y="340.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">向量化</text>
  <text x="734.0" y="364.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">批量调用 Embedding</text>
  <text x="734.0" y="383.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">失败只重试这一阶段</text>
  <text x="734.0" y="404.0" font-size="11" font-weight="400" fill="#d97706" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">noteweave.source.embed</text>
  <rect x="1060.0" y="316.0" width="300.0" height="122.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="1074.0" y="340.0" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="start">索引</text>
  <text x="1074.0" y="364.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">写入 ES 问答片段与精读资料</text>
  <text x="1074.0" y="383.0" font-size="12.5" font-weight="400" fill="#92400e" text-anchor="start">全部写完才标为可检索</text>
  <text x="1074.0" y="404.0" font-size="11" font-weight="400" fill="#d97706" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace">noteweave.source.index</text>
  <path d="M340.0,377.0 L380.0,377.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M680.0,377.0 L720.0,377.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M1020.0,377.0 L1060.0,377.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <path d="M667.0,204.0 L667.0,240.0 L190.0,240.0 L190.0,316.0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <rect x="362.0" y="231.0" width="76.0" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="400.0" y="244.0" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">资料快照 ID</text>
  <path d="M270.0,316.0 L270.0,256.0 L1158.0,256.0 L1158.0,204.0" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-violet)"/>
  <rect x="877.8" y="247.0" width="44.5" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="900.0" y="260.0" font-size="11.5" font-weight="600" fill="#7c3aed" text-anchor="middle">音视频</text>
  <rect x="40.0" y="512.0" width="420.0" height="100.0" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="54.0" y="536.0" font-size="14.5" font-weight="700" fill="#881337" text-anchor="start">幂等与重试</text>
  <text x="54.0" y="560.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">按快照、阶段与版本生成幂等键去重</text>
  <text x="54.0" y="579.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">索引失败记录下次重试时间，退避重试</text>
  <text x="54.0" y="598.0" font-size="12.5" font-weight="400" fill="#9f1239" text-anchor="start">超过次数进入死信，状态回写资料</text>
  <rect x="490.0" y="512.0" width="420.0" height="100.0" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="504.0" y="536.0" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="start">状态可见</text>
  <text x="504.0" y="560.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">资料的处理阶段、重试次数实时回写</text>
  <text x="504.0" y="579.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">前端显示阶段与下次重试时间</text>
  <text x="504.0" y="598.0" font-size="12.5" font-weight="400" fill="#3730a3" text-anchor="start">检索投影就绪前不对检索可见</text>
  <rect x="940.0" y="512.0" width="420.0" height="100.0" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="954.0" y="536.0" font-size="14.5" font-weight="700" fill="#0c4a6e" text-anchor="start">下游任务</text>
  <text x="954.0" y="560.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">noteweave.wiki.ingest：编译知识页</text>
  <text x="954.0" y="579.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">资料撤销：墓碑与异步清理（见模块二）</text>
  <text x="954.0" y="598.0" font-size="12.5" font-weight="400" fill="#075985" text-anchor="start">产物生成按冻结的快照读取原文与关键帧</text>
  <rect x="40.0" y="640.0" width="1320.0" height="88.0" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="54.0" y="664.0" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">为什么拆成阶段</text>
  <text x="54.0" y="688.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">大文件解析与向量化都很慢，同步处理会占住请求线程；拆成阶段后每个阶段可以单独扩容、单独重试，失败时能精确定位到阶段。</text>
  <text x="54.0" y="707.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">阶段之间只传快照 ID，大对象走 MinIO，消息体积固定；同一快照重复投递时按幂等键跳过。</text>
</svg>
