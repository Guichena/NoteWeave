services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: noteweave
      MYSQL_USER: noteweave
      MYSQL_PASSWORD: noteweave123
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
      - --performance-schema=ON
    volumes:
      - mysql-data:/var/lib/mysql
      - ./:/fixture:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [ma4g]

  redis:
    image: redis:7.2
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [ma4g]

  kafka:
    image: bitnamilegacy/kafka@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
      - ./:/fixture:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    networks: [ma4g]

  kafka-init:
    image: bitnamilegacy/kafka@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic noteweave.research.agent.command --partitions 4 --replication-factor 1
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic noteweave.research.agent.command.dlq --partitions 1 --replication-factor 1
    networks: [ma4g]

  backend:
    image: noteweave-ma4g-backend:local
    build:
      context: ../../backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment: &backend-environment
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/noteweave?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: noteweave
      SPRING_DATASOURCE_PASSWORD: noteweave123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTEWEAVE_KAFKA_ENABLED: "true"
      NOTEWEAVE_KAFKA_RESEARCH_AGENT_TOPIC: noteweave.research.agent.command
      NOTEWEAVE_STORAGE_BACKEND: local
      NOTEWEAVE_STORAGE_LOCAL_ROOT: /app/storage
      NOTEWEAVE_ES_ENABLED: "false"
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
      NOTEWEAVE_INTERNAL_AUTH_TOKEN: ma4g-fixture-token
      NOTEWEAVE_LOCAL_USER_FALLBACK: "false"
      NOTEWEAVE_RESEARCH_AGENT_COMMAND_DISPATCH_ENABLED: "false"
      NOTEWEAVE_RESEARCH_AGENT_LIFECYCLE_REAPER_ENABLED: "false"
      NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_ENABLED: "true"
      NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_ALLOW_LOCAL_FALLBACK: "false"
      NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_CAPACITY: 1000
      NOTEWEAVE_RESEARCH_AGENT_RATE_LIMIT_REFILL_PER_MINUTE: 1000
    volumes:
      - backend-storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks: [ma4g]

  seed-g1:
    image: mysql:8.4
    profiles: ["fixture"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./:/fixture:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mysql -hmysql -unoteweave -pnoteweave123 noteweave < /fixture/seed-g1.sql"]
    networks: [ma4g]

  seed-g4-extra:
    image: mysql:8.4
    profiles: ["fixture"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./:/fixture:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mysql -hmysql -unoteweave -pnoteweave123 noteweave < /fixture/seed-g4-extra.sql"]
    networks: [ma4g]

  worker-a:
    image: noteweave-ma4g-research-worker:local
    build:
      context: ../../workers/research-worker
    profiles: ["workers"]
    depends_on:
      backend:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.agent_kafka_consumer"]
    environment: &worker-environment
      NOTEWEAVE_JAVA_BASE_URL: http://backend:8081
      NOTEWEAVE_INTERNAL_AUTH_TOKEN: ma4g-fixture-token
      NOTEWEAVE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTEWEAVE_KAFKA_RESEARCH_AGENT_TOPIC: noteweave.research.agent.command
      NOTEWEAVE_KAFKA_RESEARCH_AGENT_DLQ_TOPIC: noteweave.research.agent.command.dlq
      NOTEWEAVE_KAFKA_RESEARCH_AGENT_GROUP_ID: noteweave-ma4g-workers
      NOTEWEAVE_KAFKA_CONSUME_MAX_ATTEMPTS: 1
      NOTEWEAVE_RESEARCH_AGENT_COMPLETION_MAX_ATTEMPTS: 3
      NOTEWEAVE_RESEARCH_AGENT_CONSUMER_ENABLED: "true"
      NOTEWEAVE_RESEARCH_AGENT_DEEP_CELL_EXECUTOR_ENABLED: "true"
      NOTEWEAVE_RESEARCH_AGENT_FAKE_PROVIDER_ENABLED: "true"
      NOTEWEAVE_RESEARCH_AGENT_WORKER_INSTANCE_ID: ma4g-worker-a
      NOTEWEAVE_RESEARCH_AGENT_LEASE_SECONDS: 120
      NOTEWEAVE_RESEARCH_LLM_API_KEY: ""
      NOTEWEAVE_RESEARCH_LLM_BASE_URL: ""
      NOTEWEAVE_RESEARCH_LLM_MODEL: ""
    networks: [ma4g]

  worker-b:
    image: noteweave-ma4g-research-worker:local
    build:
      context: ../../workers/research-worker
    profiles: ["workers"]
    depends_on:
      backend:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.agent_kafka_consumer"]
    environment:
      <<: *worker-environment
      NOTEWEAVE_RESEARCH_AGENT_WORKER_INSTANCE_ID: ma4g-worker-b
    networks: [ma4g]

  verifier:
    image: mysql:8.4
    profiles: ["fixture"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./:/fixture:ro
      - control-data:/control
    # `run verifier sh /fixture/...` supplies an argv vector.  Do not wrap it
    # in `sh -ec`: that would treat only the first word as the command string
    # and silently skip every verifier argument.
    entrypoint: []
    command: ["true"]
    networks: [ma4g]

  kafka-tools:
    image: bitnamilegacy/kafka@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107
    profiles: ["fixture"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./:/fixture:ro
    # Keep the test runner argv-preserving for `run kafka-tools sh /fixture/...`.
    entrypoint: []
    command: ["true"]
    networks: [ma4g]

  contract-verifier:
    image: noteweave-ma4g-research-worker:local
    profiles: ["fixture"]
    command: ["python", "/fixture/verify_persisted_contracts.py"]
    environment:
      MA4G_CONTRACT_EXPORT: /control/contracts.tsv
      # Python places /fixture (the script directory) first when executing an
      # absolute fixture path; retain the Worker package import root as well.
      PYTHONPATH: /app
    volumes:
      - ./:/fixture:ro
      - control-data:/control
    networks: [ma4g]

volumes:
  mysql-data:
  kafka-data:
  backend-storage:
  control-data:

networks:
  ma4g:
    internal: true
