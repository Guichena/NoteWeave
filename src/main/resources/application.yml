server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13307/noteweave?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:noteweave}
    password: ${DB_PASSWORD:noteweave}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        spring.json.trusted.packages: "*"
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

noteweave:
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:19100}
      access-key: ${MINIO_ACCESS_KEY:noteweave}
      secret-key: ${MINIO_SECRET_KEY:noteweave-minio-secret}
      bucket: ${MINIO_BUCKET:noteweave-dev}
      test-bucket: ${MINIO_TEST_BUCKET:noteweave-test}
    paths:
      local-test-root: ${NOTEWEAVE_TEST_ROOT:target/noteweave-test}
      dev-object-prefix: ${NOTEWEAVE_DEV_OBJECT_PREFIX:dev}
      test-object-prefix: ${NOTEWEAVE_TEST_OBJECT_PREFIX:test}
      test-run-id: ${NOTEWEAVE_TEST_RUN_ID:}
  upload:
    bitmap-ttl-hours: ${NOTEWEAVE_UPLOAD_BITMAP_TTL_HOURS:24}
    cleanup:
      enabled: ${NOTEWEAVE_UPLOAD_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${NOTEWEAVE_UPLOAD_CLEANUP_FIXED_DELAY_MS:600000}
  kafka:
    topics:
      task: ${NOTEWEAVE_KAFKA_TOPIC_TASK:noteweave.task}
      document-process: ${NOTEWEAVE_KAFKA_TOPIC_DOCUMENT:noteweave.document}
    consumer-groups:
      task: ${NOTEWEAVE_KAFKA_GROUP_TASK:noteweave-task-worker}
      document-process: ${NOTEWEAVE_KAFKA_GROUP_DOCUMENT:noteweave-document-process-worker}
  task:
    dispatcher:
      enabled: ${NOTEWEAVE_TASK_DISPATCHER_ENABLED:true}
      fixed-delay-ms: ${NOTEWEAVE_TASK_DISPATCHER_FIXED_DELAY_MS:5000}
  document:
    parsing:
      chunk-size: ${DOCUMENT_CHUNK_SIZE:800}
      chunk-overlap: ${DOCUMENT_CHUNK_OVERLAP:120}
      max-text-length: ${DOCUMENT_MAX_TEXT_LENGTH:2000000}
  personal:
    source:
      url-fetch:
        connect-timeout-seconds: ${NOTEWEAVE_SOURCE_URL_CONNECT_TIMEOUT_SECONDS:5}
        read-timeout-seconds: ${NOTEWEAVE_SOURCE_URL_READ_TIMEOUT_SECONDS:10}
        max-redirects: ${NOTEWEAVE_SOURCE_URL_MAX_REDIRECTS:3}
        max-response-bytes: ${NOTEWEAVE_SOURCE_URL_MAX_RESPONSE_BYTES:1048576}
  elasticsearch:
    uris: ${ES_URIS:http://localhost:19200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    index-prefix: ${NOTEWEAVE_ES_INDEX_PREFIX:noteweave-dev-}
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    stub:
      enabled: ${EMBEDDING_STUB_ENABLED:false}
    api:
      base-url: ${EMBEDDING_API_BASE_URL:${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      api-key: ${EMBEDDING_API_KEY:${EMBEDDING_KEY:}}
      model: ${EMBEDDING_API_MODEL:${EMBEDDING_MODEL:text-embedding-v4}}
      dimension: ${EMBEDDING_DIMENSION:8}
      batch-size: ${EMBEDDING_BATCH_SIZE:10}
  rag:
    retrieval:
      mode: ${RAG_RETRIEVAL_MODE:HYBRID}
      top-k: ${RAG_RETRIEVAL_TOP_K:8}
      per-document-limit: ${RAG_PER_DOCUMENT_LIMIT:3}
      context-max-chars: ${RAG_CONTEXT_MAX_CHARS:12000}
      max-merged-chars: ${RAG_MAX_MERGED_CHARS:2400}
      min-score: ${RAG_MIN_SCORE:0.0}
      bm25-weight: ${RAG_BM25_WEIGHT:1.0}
      vector-weight: ${RAG_VECTOR_WEIGHT:1.0}
      wiki-weight: ${RAG_WIKI_WEIGHT:1.3}
      rrf-k: ${RAG_RRF_K:60}
    prompt:
      no-result-text: ${RAG_NO_RESULT_TEXT:暂无相关信息}
  llm:
    stub:
      enabled: ${NOTEWEAVE_LLM_STUB_ENABLED:false}
      provider: ${NOTEWEAVE_LLM_STUB_PROVIDER:stub}
      model: ${NOTEWEAVE_LLM_STUB_MODEL:noteweave-stub-chat}
    api:
      base-url: ${LLM_API_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_API_MODEL:deepseek-chat}
      temperature: ${LLM_TEMPERATURE:0.3}
      max-tokens: ${LLM_MAX_TOKENS:2000}
      timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}

jwt:
  secret-key: ${JWT_SECRET_KEY:change-me-in-dev-change-me-in-dev}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-N/A}]"
  level:
    org.springframework.security: INFO
    com.noteweave: INFO
