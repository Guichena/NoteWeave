[project]
name = "noteweave-artifact-worker"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1",
  "kafka-python>=2.0.2,<4",
  "mcp>=1.30,<2",
  "openai>=2.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "Pillow>=11.0,<13",
  "pypdf>=6.0,<7",
  "python-pptx>=1.0.2,<2",
  "reportlab>=4.2.0,<5",
  "uvicorn>=0.32.0,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=9.0.0,<10"]

[tool.setuptools.packages.find]
include = ["app*", "mcp_servers*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
