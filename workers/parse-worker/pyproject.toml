[project]
name = "noteweave-parse-worker"
version = "0.0.1"
requires-python = ">=3.12,<3.14"
dependencies = [
  "docling==2.138.0",
  "docling-slim[format-opendocument]==2.138.0",
  "docling-slim[feat-ocr-rapidocr-onnx]==2.138.0",
  "fastapi>=0.115.0,<1",
  "pydantic-settings>=2.6.0,<3",
  "uvicorn>=0.32.0,<1",
]

[project.optional-dependencies]
test = ["pytest>=9.0.0,<10", "httpx>=0.28.0,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
